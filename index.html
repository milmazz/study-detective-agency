<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Study Detective Agency</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Baloo+2:wght@500;600;700;800&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2B2018;
    --ink-2:#3A2C1F;
    --folder:#E8DCC0;
    --folder-dark:#D8C7A0;
    --paper:#F5EFE0;
    --mustard:#D9A441;
    --mustard-dark:#B8842A;
    --red:#B23A48;
    --red-dark:#8F2B37;
    --teal:#3E7C7B;
    --teal-dark:#2C5E5D;
    --charcoal:#241F1A;
    --math-ink:#16233A;
    --ela-ink:#2A1F3D;
    --social-ink:#5B3A1E;
    --shadow: 0 6px 18px rgba(43,32,24,0.25);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 8%, rgba(217,164,65,0.10), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(62,124,123,0.10), transparent 45%),
      var(--ink);
    color:var(--charcoal);
    font-family:'Baloo 2', system-ui, sans-serif;
    min-height:100vh;
    padding:0 0 50px;
  }
  a{ color:inherit; text-decoration:none; }
  .wrap{ max-width:980px; margin:0 auto; padding:0 16px; }

  /* ---------- HERO ---------- */
  .hero{
    background: linear-gradient(180deg, var(--ink-2), var(--ink));
    padding:34px 0 26px;
    color:var(--paper);
    position:relative;
    overflow:hidden;
    border-bottom:6px solid transparent;
    border-image: repeating-linear-gradient(90deg, var(--mustard) 0 18px, transparent 18px 26px) 6;
  }
  .eyebrow{
    font-family:'Special Elite', monospace; letter-spacing:2.5px; font-size:11.5px;
    text-transform:uppercase; color:var(--mustard); margin:0 0 6px; text-align:center;
  }
  h1.site-title{
    font-family:'Special Elite', monospace;
    font-size:clamp(26px,6vw,38px);
    text-align:center; margin:0;
  }
  .site-subtitle{
    text-align:center; color:#D9CFC0; font-size:15px; margin:8px auto 0; max-width:44ch; line-height:1.5;
  }

  /* ---------- SECTIONS ---------- */
  .section{ margin-top:30px; }
  .section-head{
    display:flex; align-items:baseline; gap:10px; margin-bottom:12px; flex-wrap:wrap;
  }
  .section-head h2{
    font-family:'Special Elite', monospace; font-size:16px; color:var(--paper);
    letter-spacing:1px; margin:0; text-transform:uppercase;
  }
  .section-desc{ font-size:13px; color:#B9AF9C; margin:0; }

  /* ---------- RECENT STRIP ---------- */
  .recent-grid{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:14px;
  }

  /* ---------- CATEGORY BLOCKS ---------- */
  .category-block{
    background: rgba(245,239,224,0.04);
    border:1.5px solid rgba(217,164,65,0.25);
    border-radius:12px;
    padding:18px 18px 20px;
    margin-top:16px;
  }
  .category-title-row{ display:flex; align-items:center; gap:10px; margin-bottom:4px; }
  .category-icon{ font-size:22px; }
  .category-title{ font-family:'Special Elite', monospace; font-size:17px; color:var(--paper); }
  .category-sub{ font-size:11.5px; color:var(--mustard); letter-spacing:1px; text-transform:uppercase; }
  .category-desc{ font-size:13px; color:#B9AF9C; margin:4px 0 14px; }
  .game-grid{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:14px;
  }

  /* ---------- GAME CARD ---------- */
  .game-card{
    background:var(--folder);
    border:1.5px solid #cbb98d;
    border-left:6px solid var(--mustard);
    border-radius:8px;
    padding:14px 14px 12px;
    display:flex; flex-direction:column; gap:6px;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .game-card:hover{ transform:translateY(-2px); box-shadow:0 8px 18px rgba(0,0,0,0.28); }
  .game-card .top-row{ display:flex; align-items:center; justify-content:space-between; gap:6px; }
  .game-icon{ font-size:22px; }
  .new-tag{
    font-family:'Special Elite', monospace; font-size:9.5px; letter-spacing:1px;
    background:var(--red); color:#fff; padding:2px 7px; border-radius:20px;
  }
  .game-title{ font-size:16px; font-weight:800; color:var(--charcoal); line-height:1.25; }
  .game-blurb{ font-size:12.5px; color:#5b5140; line-height:1.45; flex-grow:1; }
  .game-cta{
    margin-top:4px; font-size:12.5px; font-weight:800; color:var(--teal-dark);
  }
  .game-card.subj-math{ border-left-color:var(--math-ink); }
  .game-card.subj-math .game-cta{ color:var(--math-ink); }
  .game-card.subj-ela{ border-left-color:var(--ela-ink); }
  .game-card.subj-ela .game-cta{ color:var(--ela-ink); }
  .game-card.subj-social-studies{ border-left-color:var(--social-ink); }
  .game-card.subj-social-studies .game-cta{ color:var(--social-ink); }

  .empty-card{
    border:1.5px dashed rgba(217,164,65,0.4);
    border-radius:8px;
    padding:18px 14px;
    text-align:center;
    color:#B9AF9C;
    font-size:13.5px;
    grid-column: 1 / -1;
  }

  footer{
    text-align:center; color:#8a7c66; font-size:12px; margin-top:40px;
  }

  @media (prefers-reduced-motion: reduce){ .game-card{ transition:none; } }
</style>
</head>
<body>

<div class="hero">
  <div class="wrap">
    <p class="eyebrow">Est. 2026</p>
    <h1 class="site-title">The Study Detective Agency</h1>
    <p class="site-subtitle">Fourth grade case files. Pick a division, open a case, get a little sharper — new cases added regularly.</p>
  </div>
</div>

<div class="wrap">
  <div class="section" id="recentSection">
    <div class="section-head">
      <h2>🆕 Newly Added Cases</h2>
    </div>
    <div class="recent-grid" id="recentGrid"></div>
  </div>

  <div class="section" id="categorySections"></div>

  <footer>Open a case file to play. New divisions and cases get added over time.</footer>
</div>

<script src="assets/games-data.js"></script>
<script>
(function(){
  "use strict";

  function daysAgo(dateStr){
    var then = new Date(dateStr + 'T00:00:00');
    var now = new Date();
    return Math.floor((now - then) / (1000*60*60*24));
  }

  function gameCardHTML(game){
    var isNew = daysAgo(game.dateAdded) <= 14;
    return '<a class="game-card subj-'+game.subject+'" href="'+game.url+'">' +
      '<div class="top-row"><span class="game-icon">'+game.icon+'</span>' +
      (isNew ? '<span class="new-tag">NEW</span>' : '') +
      '</div>' +
      '<div class="game-title">'+game.title+'</div>' +
      '<div class="game-blurb">'+game.blurb+'</div>' +
      '<div class="game-cta">Open the case \u2192</div>' +
      '</a>';
  }

  function render(){
    var games = window.GAMES_DATA || [];
    var subjects = window.SUBJECTS || [];

    // Recently added (top 3 by date, most recent first)
    var recent = games.slice().sort(function(a,b){
      return new Date(b.dateAdded) - new Date(a.dateAdded);
    }).slice(0,3);
    var recentGrid = document.getElementById('recentGrid');
    if (recent.length){
      recentGrid.innerHTML = recent.map(gameCardHTML).join('');
    } else {
      document.getElementById('recentSection').style.display = 'none';
    }

    // Category sections
    var catWrap = document.getElementById('categorySections');
    var html = '';
    subjects.forEach(function(subj){
      var subjGames = games.filter(function(g){ return g.subject === subj.id; });
      html += '<div class="category-block">';
      html += '<div class="category-title-row"><span class="category-icon">'+subj.icon+'</span>' +
        '<span class="category-title">'+subj.label+'</span></div>';
      html += '<div class="category-sub">'+subj.shortLabel+'</div>';
      html += '<p class="category-desc">'+subj.desc+'</p>';
      html += '<div class="game-grid">';
      if (subjGames.length){
        html += subjGames.map(gameCardHTML).join('');
      } else {
        html += '<div class="empty-card">No cases filed yet in this division \u2014 check back soon.</div>';
      }
      html += '</div></div>';
    });
    catWrap.innerHTML = html;
  }

  render();
})();
</script>
</body>
</html>
