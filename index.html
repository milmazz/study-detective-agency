<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Study Detective Agency</title>
<meta name="description" content="Fourth grade case files. Pick a division, open a case, get a little sharper — new cases added regularly.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕵️</text></svg>">

<meta property="og:type" content="website">
<meta property="og:site_name" content="The Study Detective Agency">
<meta property="og:url" content="https://studydetectiveagency.com/">
<meta property="og:title" content="The Study Detective Agency">
<meta property="og:description" content="Fourth grade case files. Pick a division, open a case, get a little sharper.">
<meta property="og:image" content="https://studydetectiveagency.com/assets/img/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="The Study Detective Agency">
<meta name="twitter:description" content="Fourth grade case files. Pick a division, open a case, get a little sharper.">
<meta name="twitter:image" content="https://studydetectiveagency.com/assets/img/og-image.jpg">

<!-- Fonts are self-hosted and declared in base.css. Baloo 2 is the body
     font, so it is preloaded: without this the browser cannot discover it
     until base.css has downloaded AND parsed. Path must match the url()
     in base.css exactly, or it is fetched twice. -->
<link rel="preload" as="font" type="font/woff2" href="assets/fonts/baloo2-latin1.woff2" crossorigin>
<link rel="stylesheet" href="assets/css/base.css?v=4">
<style>
/*
  Homepage-only styles, inlined to avoid a render-blocking request
  (this content used to be assets/css/site.css). base.css stays linked
  externally above instead of also being inlined here — it's shared
  with every game page, and a copy pasted into this file would drift
  from the source the moment either one gets edited.
*/
:root{
  --math-ink:#16233A;
  --ela-ink:#2A1F3D;
  --social-ink:#5B3A1E;
}
body{ padding:0 0 50px; }
.wrap{ max-width:980px; margin:0 auto; padding:0 16px; }

/* ---------- HERO ---------- */
.hero{
  background: linear-gradient(180deg, var(--ink-2), var(--ink));
  padding:34px 0 26px;
  color:var(--paper);
  position:relative;
  overflow:hidden;
  border-bottom:6px solid transparent;
  border-image: repeating-linear-gradient(90deg, var(--mustard) 0 18px, transparent 18px 26px) 6;
}
.eyebrow{
  font-family:'Special Elite', monospace; letter-spacing:2.5px; font-size:11.5px;
  text-transform:uppercase; color:var(--mustard); margin:0 0 6px; text-align:center;
}
h1.site-title{
  font-family:'Special Elite', monospace;
  font-size:clamp(26px,6vw,38px);
  text-align:center; margin:0;
}
.site-subtitle{
  /* 25.7em, not 44ch: 1ch is the width of the current font's "0", so a ch-based
     max-width re-resolves when the webfont swaps in and the line rewraps, which
     shifts the masthead height and everything under it. 44ch x 0.583em (Baloo 2's
     zero advance) is the same width the design has today, now font-independent. */
  text-align:center; color:#D9CFC0; font-size:15px; margin:8px auto 0; max-width:25.7em; line-height:1.5;
}

/* ---------- SECTIONS ---------- */
.section{ margin-top:30px; }
.section-head{
  display:flex; align-items:baseline; gap:10px; margin-bottom:12px; flex-wrap:wrap;
}
.section-head h2{
  font-family:'Special Elite', monospace; font-size:16px; color:var(--paper);
  letter-spacing:1px; margin:0; text-transform:uppercase;
}

/* ---------- RECENT STRIP ---------- */
.recent-grid{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:14px;
}

/* ---------- CATEGORY BLOCKS ---------- */
.category-block{
  background: rgba(245,239,224,0.04);
  border:1.5px solid rgba(217,164,65,0.25);
  border-radius:12px;
  padding:18px 18px 20px;
  margin-top:16px;
}
.category-title-row{ display:flex; align-items:center; gap:10px; margin-bottom:4px; }
.category-icon{ font-size:22px; }
.category-title{ font-family:'Special Elite', monospace; font-size:17px; color:var(--paper); }
.category-sub{ font-size:11.5px; color:var(--mustard); letter-spacing:1px; text-transform:uppercase; }
.category-desc{ font-size:13px; color:#B9AF9C; margin:4px 0 14px; }
.game-grid{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:14px;
}

/* ---------- GAME CARD ---------- */
.game-card{
  background:var(--folder);
  border:1.5px solid #cbb98d;
  border-left:6px solid var(--mustard);
  border-radius:8px;
  padding:14px 14px 12px;
  display:flex; flex-direction:column; gap:6px;
  transition: transform .12s ease, box-shadow .12s ease;
}
.game-card:hover{ transform:translateY(-2px); box-shadow:0 8px 18px rgba(0,0,0,0.28); }
.game-card .top-row{ display:flex; align-items:center; justify-content:space-between; gap:6px; }
.game-icon{ font-size:22px; }
.new-tag{
  font-family:'Special Elite', monospace; font-size:9.5px; letter-spacing:1px;
  background:var(--red); color:#fff; padding:2px 7px; border-radius:20px;
}
.game-title{ font-size:16px; font-weight:800; color:var(--charcoal); line-height:1.25; }
.game-blurb{ font-size:12.5px; color:#5b5140; line-height:1.45; flex-grow:1; }
.game-cta{
  margin-top:4px; font-size:12.5px; font-weight:800; color:var(--teal-dark);
}
.game-card.subj-math{ border-left-color:var(--math-ink); }
.game-card.subj-math .game-cta{ color:var(--math-ink); }
.game-card.subj-ela{ border-left-color:var(--ela-ink); }
.game-card.subj-ela .game-cta{ color:var(--ela-ink); }
.game-card.subj-social-studies{ border-left-color:var(--social-ink); }
.game-card.subj-social-studies .game-cta{ color:var(--social-ink); }

.empty-card{
  border:1.5px dashed rgba(217,164,65,0.4);
  border-radius:8px;
  padding:18px 14px;
  text-align:center;
  color:#B9AF9C;
  font-size:13.5px;
  grid-column: 1 / -1;
}

footer{
  /* #8a7c66 measured 3.90:1 on the page ground at 12px; AA needs 4.5:1. */
  text-align:center; color:#9d8e75; font-size:12px; margin-top:40px;
}

@media (prefers-reduced-motion: reduce){ .game-card{ transition:none; } }
.nojs{ background:rgba(178,58,72,0.10); border:1.5px dashed #B23A48; border-radius:8px;
  padding:14px 16px; color:var(--paper); font-weight:600; }
</style>

</head>
<body>

<div class="hero">
  <div class="wrap">
    <p class="eyebrow">Est. 2026</p>
    <h1 class="site-title">The Study Detective Agency</h1>
    <p class="site-subtitle">Fourth grade case files. Pick a division, open a case, get a little sharper — new cases added regularly.</p>
  </div>
</div>

<noscript>
  <div class="wrap">
    <p class="nojs">This catalog is built in your browser, so it needs
    JavaScript switched on to list the case files.</p>
  </div>
</noscript>

<main class="wrap">
  <div class="section" id="recentSection">
    <div class="section-head">
      <h2>🆕 Newly Added Cases</h2>
    </div>
    <div class="recent-grid" id="recentGrid"></div>
  </div>

  <div class="section" id="categorySections"></div>

  <footer>Open a case file to play. New divisions and cases get added over time.</footer>
</main>

<script>
(function(){
  "use strict";

  /*
    GAMES DATA
    ----------
    This is the only place you need to touch to add a new game to the
    site. Drop the new game's HTML file into games/<subject>/, then add
    one entry below — the homepage rebuilds the category sections and
    "recently added" row automatically.

    subject must be one of: 'math', 'ela', 'social-studies'
    dateAdded should be 'YYYY-MM-DD' so sorting works correctly.
  */
  var GAMES_DATA = [
    {
      id: 'numeration-detective-agency',
      title: 'Numbers Division: The Numeration Files',
      subject: 'math',
      icon: '🔢',
      blurb: 'Place value, expanded form, comparing, ordering, and rounding — nine cases, plus a mixed-skill trail.',
      url: 'games/math/numeration-detective-agency',
      dateAdded: '2026-08-20',
      grade: 4
    },
    {
      id: 'missing-evidence-files',
      title: 'Numbers Division: The Missing Evidence Files',
      subject: 'math',
      icon: '🧮',
      blurb: 'Multi-step word problems — build the equation, read the strip diagram, solve for the missing number. Four cases, plus a mixed-skill trail.',
      url: 'games/math/missing-evidence-files',
      dateAdded: '2026-08-27',
      grade: 4
    },
    {
      id: 'words-division',
      title: 'Words Division: Author’s Craft',
      subject: 'ela',
      icon: '📖',
      blurb: 'Author’s purpose, central message, figurative language, and why authors format text the way they do.',
      url: 'games/ela/words-division',
      dateAdded: '2026-08-24',
      grade: 4
    }
  ];

  var SUBJECTS = [
    { id:'math', label:'Numbers Division', shortLabel:'Math', icon:'🔢',
      desc:'Place value, operations, and working with numbers.' },
    { id:'ela', label:'Words Division', shortLabel:'ELA', icon:'📖',
      desc:'Reading closely and figuring out what authors are really doing.' },
    { id:'social-studies', label:'History Division', shortLabel:'Social Studies', icon:'🏛️',
      desc:'Coming soon.' }
  ];

  function daysAgo(dateStr){
    var then = new Date(dateStr + 'T00:00:00');
    var now = new Date();
    return Math.floor((now - then) / (1000*60*60*24));
  }

  function gameCardHTML(game){
    var isNew = daysAgo(game.dateAdded) <= 14;
    return '<a class="game-card subj-'+game.subject+'" href="'+game.url+'">' +
      '<div class="top-row"><span class="game-icon">'+game.icon+'</span>' +
      (isNew ? '<span class="new-tag">NEW</span>' : '') +
      '</div>' +
      '<div class="game-title">'+game.title+'</div>' +
      '<div class="game-blurb">'+game.blurb+'</div>' +
      '<div class="game-cta">Open the case →</div>' +
      '</a>';
  }

  function render(){
    var games = GAMES_DATA;
    var subjects = SUBJECTS;

    // Recently added (top 3 by date, most recent first)
    var recent = games.slice().sort(function(a,b){
      return new Date(b.dateAdded) - new Date(a.dateAdded);
    }).slice(0,3);
    var recentGrid = document.getElementById('recentGrid');
    if (recent.length){
      recentGrid.innerHTML = recent.map(gameCardHTML).join('');
    } else {
      document.getElementById('recentSection').style.display = 'none';
    }

    // Category sections
    var catWrap = document.getElementById('categorySections');
    var html = '';
    subjects.forEach(function(subj){
      var subjGames = games.filter(function(g){ return g.subject === subj.id; });
      html += '<div class="category-block">';
      html += '<div class="category-title-row"><span class="category-icon">'+subj.icon+'</span>' +
        '<span class="category-title">'+subj.label+'</span></div>';
      html += '<div class="category-sub">'+subj.shortLabel+'</div>';
      html += '<p class="category-desc">'+subj.desc+'</p>';
      html += '<div class="game-grid">';
      if (subjGames.length){
        html += subjGames.map(gameCardHTML).join('');
      } else {
        html += '<div class="empty-card">No cases filed yet in this division — check back soon.</div>';
      }
      html += '</div></div>';
    });
    catWrap.innerHTML = html;
  }

  render();
})();
</script>
</body>
</html>
