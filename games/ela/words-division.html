<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Words Division — Detective Agency</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Baloo+2:wght@500;600;700;800&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2A1F3D;
    --ink-2:#372A4E;
    --folder:#E8DCC0;
    --folder-dark:#D8C7A0;
    --paper:#F5EFE0;
    --mustard:#D9A441;
    --mustard-dark:#B8842A;
    --red:#B23A48;
    --red-dark:#8F2B37;
    --teal:#3E7C7B;
    --teal-dark:#2C5E5D;
    --charcoal:#241F1A;
    --cork:#8a6a4b;
    --shadow: 0 6px 18px rgba(42,31,61,0.25);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 10%, rgba(217,164,65,0.08), transparent 40%),
      radial-gradient(circle at 85% 85%, rgba(62,124,123,0.10), transparent 45%),
      var(--ink);
    color:var(--charcoal);
    font-family:'Baloo 2', system-ui, sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:18px 12px 40px;
  }
  .agency{
    width:100%;
    max-width:760px;
  }
  .masthead{
    background: linear-gradient(180deg, var(--ink-2), var(--ink));
    border:2px solid #0d1626;
    border-radius:14px 14px 4px 4px;
    padding:18px 20px 14px;
    color:var(--paper);
    box-shadow: var(--shadow);
    position:relative;
    overflow:hidden;
  }
  .masthead::after{
    content:"";
    position:absolute; left:0; right:0; bottom:0; height:6px;
    background: repeating-linear-gradient(90deg, var(--mustard) 0 18px, transparent 18px 26px);
    opacity:0.85;
  }
  .masthead-top{
    display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
  }
  .eyebrow{
    font-family:'Special Elite', monospace;
    letter-spacing:2px;
    font-size:11px;
    color:var(--mustard);
    text-transform:uppercase;
    margin:0 0 4px;
  }
  h1.title{
    font-family:'Special Elite', monospace;
    font-size:clamp(22px,5vw,30px);
    margin:0;
    line-height:1.15;
  }
  .subtitle{
    margin:6px 0 0;
    font-size:14.5px;
    color:#C9D2E2;
    max-width:46ch;
  }
  .badge-counter{
    flex-shrink:0;
    text-align:center;
    background:rgba(217,164,65,0.14);
    border:1.5px solid var(--mustard);
    border-radius:10px;
    padding:8px 12px;
    min-width:76px;
  }
  .badge-counter .num{ font-size:22px; font-weight:800; color:var(--mustard); line-height:1; }
  .badge-counter .lbl{ font-size:9.5px; letter-spacing:1px; text-transform:uppercase; color:#C9D2E2; margin-top:3px; }

  #app{
    background: var(--folder);
    border:2px solid #0d1626;
    border-top:none;
    border-radius:0 0 12px 12px;
    padding:20px;
    box-shadow: var(--shadow);
  }

  /* ---------- HOME / CASE SELECT ---------- */
  .home-intro{
    font-size:14.5px;
    color:#4b4234;
    margin:0 0 16px;
    line-height:1.5;
  }
  .case-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(230px,1fr));
    gap:12px;
  }
  .case-card{
    background:var(--paper);
    border:1.5px solid #cbb98d;
    border-left:6px solid var(--mustard);
    border-radius:8px;
    padding:14px 14px 12px;
    text-align:left;
    cursor:pointer;
    font-family:inherit;
    transition: transform .12s ease, box-shadow .12s ease;
    display:flex; flex-direction:column; gap:6px;
  }
  .case-card:hover{ transform:translateY(-2px); box-shadow:0 6px 14px rgba(0,0,0,0.18); }
  .case-card:focus-visible{ outline:3px solid var(--teal); outline-offset:2px; }
  .case-no{
    font-family:'Special Elite', monospace;
    font-size:11px; letter-spacing:1px; color:var(--red);
  }
  .case-title{ font-size:17px; font-weight:800; color:var(--ink); }
  .case-blurb{ font-size:12.5px; color:#5b5140; line-height:1.4; }
  .case-cta{ margin-top:4px; font-size:12.5px; font-weight:700; color:var(--teal-dark); }
  .case-solved-tag{
    font-size:10.5px; font-weight:700; color:var(--teal-dark);
    background: rgba(62,124,123,0.14); border:1px solid var(--teal);
    border-radius:20px; padding:2px 8px; align-self:flex-start;
  }
  .trail-card{
    width:100%;
    border-left:6px solid var(--red);
    background: linear-gradient(135deg, var(--paper) 60%, rgba(178,58,72,0.06));
  }
  .trail-card .case-no{ color:var(--red); }
  .trail-card .case-title{ font-size:18px; }
  .trail-card .case-cta{ color:var(--red-dark); }

  /* ---------- TRAIL MAP ---------- */
  .trail-map-wrap{ margin-bottom:16px; }
  .trail-map-wrap svg{ width:100%; height:auto; display:block; }
  .trail-node-label{
    font-family:'Roboto Mono', monospace; font-size:9px; fill:var(--ink-2); text-anchor:middle;
  }
  .trail-legend{
    display:flex; gap:16px; justify-content:center; font-size:11px; color:#5b5140; margin-top:2px; flex-wrap:wrap;
  }
  .trail-legend span{ display:inline-flex; align-items:center; gap:4px; }
  .trail-dot{ width:9px; height:9px; border-radius:50%; display:inline-block; }

  /* ---------- TOP BAR DURING PLAY ---------- */
  .playbar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:14px; flex-wrap:wrap; gap:8px;
  }
  .back-btn{
    background:none; border:none; font-family:inherit; font-weight:700;
    color:var(--teal-dark); cursor:pointer; font-size:13.5px; padding:4px 0;
  }
  .back-btn:hover{ text-decoration:underline; }
  .progress-pill{
    font-family:'Roboto Mono', monospace; font-size:12.5px; font-weight:700;
    background:var(--folder-dark); border-radius:20px; padding:4px 12px; color:var(--ink);
  }
  .streak-pill{
    font-size:12.5px; font-weight:700; color:var(--red-dark);
  }

  /* ---------- QUESTION CARD ---------- */
  .case-file{
    background:var(--paper);
    border:1.5px solid #cbb98d;
    border-radius:8px;
    padding:20px 18px 18px;
    position:relative;
    overflow:hidden;
    min-height:220px;
  }
  .q-mode-label{
    font-family:'Special Elite', monospace;
    font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--red);
    margin:0 0 8px;
  }
  .q-prompt{
    font-size:16.5px; font-weight:700; color:var(--ink); line-height:1.45; margin:0 0 16px;
  }
  .q-prompt .hl{
    color:var(--red-dark);
    background:rgba(178,58,72,0.10);
    padding:0 3px; border-radius:3px;
  }
  .passage-box{
    background:#fff; border:1.5px solid #cbb98d; border-radius:8px;
    padding:14px 16px; margin:4px 0 14px;
    font-family:'Baloo 2', sans-serif; font-weight:400; font-size:15.5px;
    line-height:1.65; color:var(--charcoal);
  }
  .passage-highlight{
    background:rgba(217,164,65,0.40); padding:1px 4px; border-radius:3px; font-weight:700;
  }
  .format-target{
    background:rgba(178,58,72,0.10); border-bottom:2.5px solid var(--red);
    padding:0 3px; border-radius:2px;
  }
  .fmt-bold{ font-weight:800; }
  .fmt-italic{ font-style:italic; }
  .fmt-caps{ text-transform:uppercase; letter-spacing:0.5px; }
  .q-line{ font-weight:700; }

  .number-display{
    font-family:'Roboto Mono', monospace;
    font-size:clamp(22px,6vw,30px);
    font-weight:700;
    letter-spacing:1px;
    color:var(--ink);
    margin:6px 0 18px;
    text-align:center;
    word-break:break-all;
  }
  .digit-box{
    display:inline-block;
    padding:2px 3px;
    border-radius:5px;
    cursor:pointer;
    transition: background .1s ease, transform .1s ease;
  }
  .digit-box:hover{ background:rgba(217,164,65,0.35); }
  .digit-box:focus-visible{ outline:3px solid var(--teal); }
  .digit-box.picked{ background:var(--mustard); color:#241a08; border-radius:6px; }
  .comma-sep{ color:#8a7c5e; }
  .num-sub{
    font-family:'Roboto Mono', monospace; color:var(--ink-2); font-weight:700;
  }
  .num-highlight{
    background:rgba(217,164,65,0.45);
    border-radius:4px;
    padding:0 2px;
    border-bottom:2.5px solid var(--red);
  }

  .two-numbers{
    display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin:10px 0 18px;
  }
  .num-card{
    background:#fff; border:1.5px solid #cbb98d; border-radius:8px;
    padding:10px 14px; text-align:center; min-width:150px;
  }
  .num-card .who{ font-size:11.5px; font-weight:700; color:var(--teal-dark); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:4px;}
  .num-card .val{ font-family:'Roboto Mono', monospace; font-size:19px; font-weight:700; color:var(--ink); }

  .options-grid{
    display:grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr));
    gap:10px; margin-top:6px;
  }
  .opt-btn{
    background:#fff; border:1.5px solid #cbb98d; border-radius:8px;
    padding:12px 10px; font-family:inherit; font-size:14.5px; font-weight:700;
    color:var(--ink); cursor:pointer; text-align:left;
    transition: border-color .1s ease, background .1s ease;
  }
  .opt-btn:hover{ border-color:var(--mustard); background:#fffaf0; }
  .opt-btn:focus-visible{ outline:3px solid var(--teal); }
  .opt-btn.chosen{ border-color:var(--teal); background:rgba(62,124,123,0.12); }
  .opt-btn.is-correct{ border-color:var(--teal); background:rgba(62,124,123,0.22); }
  .opt-btn.is-wrong{ border-color:var(--red); background:rgba(178,58,72,0.14); }
  .opt-btn[disabled]{ cursor:default; }
  .opt-btn .chk{ display:inline-block; width:16px; }

  .symbol-row{ display:flex; gap:12px; justify-content:center; margin-top:6px; }
  .symbol-btn{
    font-family:'Roboto Mono', monospace; font-size:26px; font-weight:700;
    width:64px; height:56px; border-radius:8px; border:1.5px solid #cbb98d;
    background:#fff; cursor:pointer; color:var(--ink);
  }
  .symbol-btn:hover{ border-color:var(--mustard); }
  .symbol-btn:focus-visible{ outline:3px solid var(--teal); }

  .tf-row{ display:flex; gap:10px; margin-top:6px; }
  .tf-btn{
    flex:1; font-family:inherit; font-weight:800; font-size:15px;
    padding:12px; border-radius:8px; border:1.5px solid #cbb98d; background:#fff; cursor:pointer;
  }
  .tf-btn:hover{ border-color:var(--mustard); }

  .order-row{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:6px; }
  .order-tile{
    position:relative;
    font-family:'Roboto Mono', monospace; font-size:16px; font-weight:700;
    padding:14px 12px; border-radius:8px; border:1.5px solid #cbb98d; background:#fff; cursor:pointer;
    min-width:110px; text-align:center;
  }
  .order-tile .slot{
    position:absolute; top:-9px; left:-9px; background:var(--mustard); color:#241a08;
    width:24px; height:24px; border-radius:50%; font-size:12.5px; font-weight:800;
    display:flex; align-items:center; justify-content:center; border:2px solid #fff;
  }
  .order-tile.locked{ background:#fff8e8; border-color:var(--mustard); }
  .order-hint{ font-size:12px; color:#6b6150; text-align:center; margin-top:8px; }

  .check-btn{
    margin-top:18px;
    background:var(--mustard); color:#241a08; border:none; border-radius:8px;
    padding:11px 22px; font-family:inherit; font-weight:800; font-size:14.5px; cursor:pointer;
    box-shadow: 0 3px 0 var(--mustard-dark);
  }
  .check-btn:hover{ filter:brightness(1.04); }
  .check-btn:active{ transform:translateY(2px); box-shadow:none; }
  .check-btn[disabled]{ opacity:0.5; cursor:default; box-shadow:none; }
  .clear-link{
    background:none;border:none;font-family:inherit;font-size:12.5px;font-weight:700;
    color:var(--teal-dark); cursor:pointer; margin-left:12px;
  }

  .explain-box{
    margin-top:16px; padding:12px 14px; border-radius:8px;
    background:#fff; border:1.5px dashed #cbb98d; font-size:13.5px; line-height:1.5; color:#3a3324;
  }
  .next-btn{
    margin-top:14px;
    background:var(--teal); color:#fff; border:none; border-radius:8px;
    padding:11px 22px; font-family:inherit; font-weight:800; font-size:14.5px; cursor:pointer;
    box-shadow: 0 3px 0 var(--teal-dark);
  }
  .next-btn:hover{ filter:brightness(1.06); }
  .next-btn:active{ transform:translateY(2px); box-shadow:none; }

  .stamp{
    position:absolute; top:18px; right:18px;
    font-family:'Special Elite', monospace;
    font-size:15px; font-weight:700; letter-spacing:1.5px;
    padding:8px 14px; border-radius:6px;
    border:3px solid currentColor;
    text-transform:uppercase;
    transform: rotate(-10deg) scale(0);
    animation: stampIn .35s ease-out forwards;
    pointer-events:none;
  }
  .stamp.ok{ color:var(--teal-dark); }
  .stamp.no{ color:var(--red); }
  @keyframes stampIn{
    0%{ transform:rotate(-10deg) scale(2.2); opacity:0; }
    60%{ transform:rotate(-10deg) scale(0.92); opacity:1; }
    100%{ transform:rotate(-10deg) scale(1); opacity:1; }
  }

  /* ---------- SUMMARY ---------- */
  .summary{
    text-align:center; padding:16px 6px;
  }
  .summary .stamp-big{
    display:inline-block;
    font-family:'Special Elite', monospace;
    font-size:26px; letter-spacing:2px; text-transform:uppercase;
    border:4px solid var(--teal-dark); color:var(--teal-dark);
    padding:10px 20px; border-radius:8px; transform:rotate(-6deg);
    margin-bottom:14px;
  }
  .summary .rank{ font-size:19px; font-weight:800; color:var(--ink); margin:6px 0 4px; }
  .summary .rank-note{ font-size:13.5px; color:#5b5140; margin-bottom:16px; }
  .summary .stat-row{ display:flex; justify-content:center; gap:26px; margin:12px 0 20px; flex-wrap:wrap; }
  .summary .stat{ text-align:center; }
  .summary .stat .n{ font-size:24px; font-weight:800; color:var(--ink); font-family:'Roboto Mono', monospace; }
  .summary .stat .l{ font-size:11px; letter-spacing:1px; text-transform:uppercase; color:#6b6150; }
  .summary-btns{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }

  .sr-only{
    position:absolute; width:1px;height:1px; padding:0;margin:-1px;overflow:hidden;
    clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }
  @media (prefers-reduced-motion: reduce){
    .stamp{ animation:none; transform:rotate(-10deg) scale(1); opacity:1; }
    .case-card{ transition:none; }
  }
</style>
</head>
<body>
<div class="agency">
  <div class="masthead">
    <div class="masthead-top">
      <div>
        <p class="eyebrow">Detective Agency · Est. 2026</p>
        <h1 class="title">Words Division</h1>
        <p class="subtitle">Every passage is a clue. Figure out what the author really wants you to think, feel, or notice.</p>
      </div>
      <div class="badge-counter">
        <div class="num" id="badgeNum">0</div>
        <div class="lbl">Cases<br>Closed</div>
      </div>
    </div>
  </div>
  <div id="app"></div>
</div>

<script>
(function(){
  "use strict";

  /* ================= CORE HELPERS ================= */
  function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
  function choice(arr){ return arr[randInt(0,arr.length-1)]; }
  function shuffle(arr){
    var a = arr.slice();
    for (var i=a.length-1;i>0;i--){ var j=randInt(0,i); var t=a[i]; a[i]=a[j]; a[j]=t; }
    return a;
  }
  function fmt(n){ return n.toLocaleString('en-US'); }
  // Build a 4-option MCQ from a fixed pool of {key,label}, guaranteeing the correct
  // one is included and options aren't duplicated.
  function buildOptionsFromPool(pool, correctKey, count){
    count = count || 4;
    var correct = pool.filter(function(o){ return o.key===correctKey; })[0];
    var rest = shuffle(pool.filter(function(o){ return o.key!==correctKey; }));
    var picked = [correct].concat(rest.slice(0, Math.min(count-1, rest.length)));
    return shuffle(picked);
  }

  /* ================= STATE ================= */
  var state = {
    screen:'home', modeId:null, qIndex:0, total:8,
    score:0, streak:0, current:null, answered:false,
    orderPicks:[], tfPick:null, msPick:[], badges:0,
    trailSeq:[], trailIdx:0, trailWrongTurns:0, trailCurrentMissed:false
  };
  var TRAIL_LENGTH = 10;

  /* ================= CONTENT: passages & craft-move data ================= */

  var PURPOSE_ITEMS = [
    { text:'Every kid should get at least one pet. Pets teach us responsibility, keep us active, and are always happy to see us after a long day. If your family hasn\u2019t gotten a pet yet, now is the perfect time to ask!',
      correct:'persuade',
      explain:'The author gives reasons ("teach us responsibility... keep us active") and ends with a call to action ("ask!") \u2014 classic signs of persuasive writing.' },
    { text:'Honey bees visit about two million flowers to make just one pound of honey. Inside the hive, worker bees fan their wings to keep the temperature steady at around 95 degrees. A single hive can hold up to 60,000 bees.',
      correct:'inform',
      explain:'The passage is packed with facts and numbers (two million flowers, 95 degrees, 60,000 bees) and has no opinions or story \u2014 that\u2019s typical of informational writing.' },
    { text:'Milo tiptoed down the creaky stairs, his flashlight trembling in his hand. Somewhere in the dark kitchen, something clattered to the floor. He froze. Was that... giggling?',
      correct:'entertain',
      explain:'This passage builds suspense with a character, setting, and action \u2014 hallmarks of a story meant to entertain the reader.' },
    { text:'Our school playground needs new equipment. The swings are rusty, the slide has a crack, and there\u2019s only one working seesaw for the whole third grade. Please vote yes for the new playground fund so every student can play safely.',
      correct:'persuade',
      explain:'The author lists problems and asks the reader to take an action ("vote yes"), which is the goal of persuasive writing.' },
    { text:'The Great Wall of China stretches over 13,000 miles. It was built over many centuries by different Chinese dynasties to protect against invasions. Today, sections of the wall attract millions of visitors every year.',
      correct:'inform',
      explain:'Dates, measurements, and historical facts with no opinion or story make this informational writing.' },
    { text:'Penny\u2019s stomach did a flip as the roller coaster clicked slowly up the first hill. She grabbed her brother\u2019s arm. "I changed my mind!" she squeaked, right as the coaster tipped over the edge.',
      correct:'entertain',
      explain:'A character, feelings, and a moment of action pull the reader into a story \u2014 that\u2019s writing meant to entertain.' }
  ];

  var MESSAGE_ITEMS = [
    { text:'Jae practiced his violin every single day, even when his fingers ached and his friends were outside playing. At the winter concert, his hard work finally paid off \u2014 his solo was the best one all night.',
      options:[
        {key:'a', label:'Hard work and practice lead to success.'},
        {key:'b', label:'Playing outside is more fun than practicing.'},
        {key:'c', label:'Jae played the violin at a winter concert.'},
        {key:'d', label:'Music concerts happen in winter.'}
      ], correctKey:'a',
      explain:'The passage focuses on Jae\u2019s daily effort paying off, which points to a message about hard work and practice \u2014 not just a summary of what happened.' },
    { text:'When Ravi saw a boy sitting alone at lunch, he almost kept walking to his usual table. But he stopped, turned around, and asked, "Mind if I sit here?" By the end of lunch, they were already planning to trade comic books.',
      options:[
        {key:'a', label:'Ravi likes comic books.'},
        {key:'b', label:'It\u2019s important to always sit with your usual friends.'},
        {key:'c', label:'A small act of kindness can start a new friendship.'},
        {key:'d', label:'Lunchtime is the best part of the school day.'}
      ], correctKey:'c',
      explain:'Ravi\u2019s choice to include someone new is what the story is really about \u2014 a small kind action leading to a friendship.' },
    { text:'The tortoise moved slower than every other animal in the race, and the other animals laughed. But while the hare stopped to nap, the tortoise kept walking, one slow step at a time \u2014 and crossed the finish line first.',
      options:[
        {key:'a', label:'Tortoises are faster than hares.'},
        {key:'b', label:'The hare won the race.'},
        {key:'c', label:'Naps are bad for you.'},
        {key:'d', label:'Slow, steady effort can win over speed and overconfidence.'}
      ], correctKey:'d',
      explain:'The tortoise wasn\u2019t actually faster \u2014 it just kept going steadily while the hare got overconfident. That\u2019s the real lesson, not a fact about the animals themselves.' },
    { text:'Every day, Grandma Lucia saved a little money in a jar labeled "Someday." Years later, when Mia needed help paying for her first year of college, Grandma Lucia handed her the jar, now overflowing with bills and coins.',
      options:[
        {key:'a', label:'Mia went to college.'},
        {key:'b', label:'Small, consistent efforts can add up to something big over time.'},
        {key:'c', label:'You should never spend your money.'},
        {key:'d', label:'Grandmothers are always generous.'}
      ], correctKey:'b',
      explain:'The jar filling up slowly, day by day, is the whole point of the story \u2014 small steps adding up over time.' },
    { text:'Sam\u2019s science project fell apart the night before it was due \u2014 literally, the volcano crumbled. He almost gave up, but instead he stayed up rebuilding it with cardboard and tape. It wasn\u2019t perfect, but it was his, and he was proud when he presented it.',
      options:[
        {key:'a', label:'Sam built a volcano for his science project.'},
        {key:'b', label:'Science projects should always be perfect.'},
        {key:'c', label:'Cardboard and tape are good building materials.'},
        {key:'d', label:'Perseverance and pride in your own effort matter more than perfection.'}
      ], correctKey:'d',
      explain:'Sam didn\u2019t end up with a perfect project \u2014 he ended up with one he was proud of because he didn\u2019t give up. That\u2019s the message.' }
  ];

  var FIGLANG_POOL = [
    {key:'simile', label:'Simile \u2014 compares using "like" or "as"'},
    {key:'metaphor', label:'Metaphor \u2014 compares directly, no "like/as"'},
    {key:'personification', label:'Personification \u2014 gives human traits to something non-human'},
    {key:'hyperbole', label:'Hyperbole \u2014 an obvious exaggeration'},
    {key:'idiom', label:'Idiom \u2014 a phrase that doesn\u2019t mean what it literally says'}
  ];
  var FIGLANG_ITEMS = [
    { before:'The wind ', hl:'howled through the trees', after:' all night long.', correct:'personification',
      explain:'Wind can\u2019t literally howl like an animal \u2014 giving it a human/animal action like "howling" is personification.' },
    { before:'Her smile was ', hl:'as bright as the sun', after:'.', correct:'simile',
      explain:'This compares two things using "as... as," which makes it a simile.' },
    { before:'The classroom was ', hl:'a zoo', after:' after the substitute left the room.', correct:'metaphor',
      explain:'Calling the classroom "a zoo" directly, without "like" or "as," makes this a metaphor.' },
    { before:'I\u2019ve told you ', hl:'a million times', after:' to clean your room.', correct:'hyperbole',
      explain:'No one has really said something a literal million times \u2014 this is an obvious exaggeration, or hyperbole.' },
    { before:'Grandpa said the news really ', hl:'let the cat out of the bag', after:'.', correct:'idiom',
      explain:'"Let the cat out of the bag" doesn\u2019t literally involve a cat \u2014 it\u2019s an idiom that means revealing a secret.' },
    { before:'The old floorboards ', hl:'groaned and complained', after:' under every footstep.', correct:'personification',

    { before:'She ran ', hl:'like a cheetah', after:' to catch the bus.', correct:'simile',
      explain:'Comparing her running to a cheetah using the word "like" makes this a simile.' }
  ];

  var FORMAT_POOL = [
    {key:'shout', label:'Shows a character is shouting or speaking loudly'},
    {key:'emphasis', label:'Emphasizes the single most important idea'},
    {key:'vocab', label:'Signals an important vocabulary word being defined'},
    {key:'sarcasm', label:'Shows sarcasm \u2014 the word means the opposite'},
    {key:'title', label:'Marks the title of a book, movie, or show'},
    {key:'thought', label:'Shows a character\u2019s silent, inner thought'}
  ];
  var FORMAT_ITEMS = [
    { before:'Coach blew the whistle and yelled, "', hl:'STOP RIGHT THERE!', after:'"', hlClass:'fmt-caps', correct:'shout',
      explain:'Writing words in ALL CAPS often shows that a character is shouting or speaking very loudly.' },
    { before:'The most important rule of the science lab is this: ', hl:'never touch the chemicals without gloves', after:'.', hlClass:'fmt-bold', correct:'emphasis',
      explain:'Bold text draws the reader\u2019s eye to the single most important idea in the sentence.' },
    { before:'A ', hl:'habitat', after:' is the natural home or environment where a plant or animal lives.', hlClass:'fmt-bold', correct:'vocab',
      explain:'Bolding a word right before it\u2019s defined is a common way authors flag an important vocabulary term.' },
    { before:'After Marco spilled juice all over his homework, his sister said, "Nice job, ', hl:'\u2018genius\u2019', after:'."', hlClass:'', correct:'sarcasm',
      explain:'Marco clearly didn\u2019t do a nice job \u2014 putting "genius" in quotes signals sarcasm, where the word means the opposite of what it says.' },
    { before:'Have you read ', hl:'Because of Winn-Dixie', after:'? It\u2019s one of my favorite books.', hlClass:'fmt-italic', correct:'title',
      explain:'Italics are the standard way authors format the title of a book, movie, or show.' },
    { before:'', hl:'I can\u2019t believe I forgot my lines,', after:' Zoe thought as she walked on stage.', hlClass:'fmt-italic', correct:'thought',
      explain:'Italics are often used to show what a character is thinking silently, rather than saying out loud.' }
  ];

  /* ================= QUESTION GENERATORS ================= */

  function genPurpose(){
    var item = choice(PURPOSE_ITEMS);
    var opts = shuffle([
      {key:'persuade', label:'To persuade the reader'},
      {key:'inform', label:'To inform the reader with facts'},
      {key:'entertain', label:'To entertain the reader with a story'}
    ]);
    return {
      type:'mcq-simple',
      prompt: '<div class="passage-box">' + item.text + '</div><span class="q-line">What is the author\u2019s main purpose for writing this passage?</span>',
      options: opts,
      correctKey: item.correct,
      explain: function(){ return item.explain; }
    };
  }

  function genMessage(){
    var item = choice(MESSAGE_ITEMS);
    return {
      type:'mcq-simple',
      prompt: '<div class="passage-box">' + item.text + '</div><span class="q-line">Which statement best captures the central message of this passage?</span>',
      options: item.options,
      correctKey: item.correctKey,
      explain: function(){ return item.explain; }
    };
  }

  function genFigLang(){
    var item = choice(FIGLANG_ITEMS);
    var opts = buildOptionsFromPool(FIGLANG_POOL, item.correct, 5);
    return {
      type:'mcq-simple',
      prompt: '<div class="passage-box">' + item.before + '<span class="passage-highlight">' + item.hl + '</span>' + item.after + '</div><span class="q-line">What kind of figurative language is highlighted above?</span>',
      options: opts,
      correctKey: item.correct,
      explain: function(){ return item.explain; }
    };
  }

  function genFormat(){
    var item = choice(FORMAT_ITEMS);
    var opts = buildOptionsFromPool(FORMAT_POOL, item.correct, 4);
    var hlContent = '<span class="format-target ' + (item.hlClass||'') + '">' + item.hl + '</span>';
    return {
      type:'mcq-simple',
      prompt: '<div class="passage-box">' + item.before + hlContent + item.after + '</div><span class="q-line">Why did the author format the highlighted text that way?</span>',
      options: opts,
      correctKey: item.correct,
      explain: function(){ return item.explain; }
    };
  }
  /* ================= MODE CONFIG ================= */
  var MODES = [
    { id:'purpose', caseNo:'01', title:'What\u2019s the Angle?', icon:'🎯',
      blurb:'Work out whether the author is trying to persuade, inform, or entertain.', gen: genPurpose },
    { id:'message', caseNo:'02', title:'Between the Lines', icon:'💭',
      blurb:'Read a short story and find the message the author is really making.', gen: genMessage },
    { id:'figlang', caseNo:'03', title:'Word Detective', icon:'🔍',
      blurb:'Spot similes, metaphors, personification, hyperbole, and idioms.', gen: genFigLang },
    { id:'format', caseNo:'04', title:'Fine Print', icon:'🖋️',
      blurb:'Work out why the author used bold, italics, CAPS, or quotes.', gen: genFormat }
  ];
  var solvedCases = {};

  /* ================= RENDER: HOME ================= */
  function renderHome(){
    var html = '<p class="home-intro">Four case files. Every case pulls a fresh passage or example, so you can reopen a file as many times as you need to practice.</p>';
    html += '<div class="case-grid">';
    MODES.forEach(function(m){
      html += '<button class="case-card" data-mode="'+m.id+'">' +
        (solvedCases[m.id] ? '<span class="case-solved-tag">✓ Solved before</span>' : '') +
        '<span class="case-no">CASE NO. '+m.caseNo+'</span>' +
        '<span class="case-title">'+m.icon+' '+m.title+'</span>' +
        '<span class="case-blurb">'+m.blurb+'</span>' +
        '<span class="case-cta">Take the case →</span>' +
        '</button>';
    });
    html += '</div>';
    html += '<button class="case-card trail-card" id="trailCard" style="margin-top:14px;">' +
      '<span class="case-no">CASE NO. 05 · THE BIG ONE</span>' +
      '<span class="case-title">🗺️ The Trail — Follow the Numbers</span>' +
      '<span class="case-blurb">A winding trail of '+TRAIL_LENGTH+' clues pulled from all four files. Solve each one to move down the path to the finish.</span>' +
      '<span class="case-cta">Start the trail →</span>' +
      '</button>';

    document.querySelectorAll('.case-card:not(.trail-card)').forEach(function(btn){
      btn.addEventListener('click', function(){ startMode(btn.getAttribute('data-mode')); });

    document.getElementById('trailCard').addEventListener('click', startTrail);
  }

  function startMode(modeId){
    state.screen='play'; state.modeId=modeId; state.qIndex=0; state.score=0; state.streak=0;
    nextQuestion();
  }

  function nextQuestion(){
    state.answered=false; state.orderPicks=[]; state.tfPick=null; state.msPick=[];
    var mode = MODES.filter(function(m){return m.id===state.modeId;})[0];
    state.current = mode.gen();
    renderPlay();
  }

  /* ================= RENDER: PLAY ================= */
  function renderPlay(){
    var mode = MODES.filter(function(m){return m.id===state.modeId;})[0];
    var q = state.current;
    var html = '';
    html += '<div class="playbar">';
    html += '<button class="back-btn" id="backBtn">← Case Files</button>';
    html += '<span class="progress-pill">Clue '+(state.qIndex+1)+' of '+state.total+'</span>';
    html += '<span class="streak-pill">🔥 Streak: '+state.streak+'</span>';
    html += '</div>';

    html += '<div class="case-file" id="caseFile">';
    html += '<p class="q-mode-label">'+mode.icon+' Case No. '+mode.caseNo+' — '+mode.title+'</p>';
    html += '<div class="q-prompt">'+q.prompt+'</div>';

    html += buildInteractiveBody(q);
    html += '</div>'; // case-file
    document.getElementById('app').innerHTML = html;

    document.getElementById('backBtn').addEventListener('click', function(){ state.screen='home'; renderHome(); });
    wireInteractive(q, finishAnswer);
  }

  /* ================= SHARED: QUESTION BODY (used by case mode + trail mode) ================= */
  function buildInteractiveBody(q){
    var html = '';
    if (q.type==='click-digit'){
      html += renderDigitDisplay(q.number, null);
    } else if (q.type==='value-compare'){
      if (q.sameNumber){
        html += renderDigitDisplayHighlight(q.numA, [q.aIdx, q.bIdx]);
      } else {
        html += '<div class="two-numbers">' +
          '<div class="num-card"><div class="who">Number A</div><div class="val">'+numWithHighlight(q.numA,q.aIdx)+'</div></div>' +
          '<div class="num-card"><div class="who">Number B</div><div class="val">'+numWithHighlight(q.numB,q.bIdx)+'</div></div>' +
          '</div>';
      }
      html += '<div class="options-grid" id="optGrid">' + q.options.map(function(o){
        return '<button class="opt-btn" data-key="'+o.key+'">'+o.label+'</button>';
      }).join('') + '</div>';
    } else if (q.type==='mcq-simple'){
      html += '<div class="options-grid" id="optGrid">' + q.options.map(function(o){
        return '<button class="opt-btn" data-key="'+o.key+'">'+o.label+'</button>';
      }).join('') + '</div>';
    } else if (q.type==='multiselect'){
      html += '<div class="options-grid" id="optGrid">' + q.options.map(function(o){
        return '<button class="opt-btn" data-key="'+o.key+'"><span class="chk">☐</span>'+o.label+'</button>';
      }).join('') + '</div>';
      html += '<button class="check-btn" id="checkBtn">Check My Answers</button>';
    } else if (q.type==='true-false'){
      html += '<div class="tf-row" id="tfRow">' +
        '<button class="tf-btn" data-v="true">TRUE</button>' +
        '<button class="tf-btn" data-v="false">FALSE</button>' +
        '</div>';
    } else if (q.type==='order'){
      html += '<div class="order-row" id="orderRow">' + q.numbers.map(function(v){
        return '<button class="order-tile" data-v="'+v+'">'+fmt(v)+'</button>';
      }).join('') + '</div>';
      html += '<p class="order-hint">Click smallest first, largest last. <button class="clear-link" id="clearOrder">Clear picks</button></p>';
    } else if (q.type==='symbol'){
      html += '<div class="two-numbers">' +
        '<div class="num-card"><div class="val">'+fmt(q.a)+'</div></div>' +
        '<div class="num-card"><div class="val">'+fmt(q.b)+'</div></div>' +
        '</div>';
      html += '<div class="symbol-row" id="symRow">' +
        ['<','>','='].map(function(s){ return '<button class="symbol-btn" data-v="'+s+'">'+s+'</button>'; }).join('') +
        '</div>';
    }
    return html;
  }

  function renderDigitDisplay(num, highlightIdxArr){
    var formatted = fmt(num);
    var raw = String(num);
    var ptr = 0;
    var out = '<div class="number-display">';
    for (var i=0;i<formatted.length;i++){
      var ch = formatted[i];
      if (ch===','){ out += '<span class="comma-sep">,</span>'; }
      else {
        var placeIdx = raw.length-1-ptr;
        out += '<span class="digit-box" tabindex="0" data-place="'+placeIdx+'" data-digit="'+ch+'">'+ch+'</span>';
        ptr++;
      }
    }
    out += '</div>';
    return out;
  }
  function renderDigitDisplayHighlight(num, idxArr){
    var formatted = fmt(num);
    var raw = String(num);
    var ptr = 0;
    var out = '<div class="number-display">';
    for (var i=0;i<formatted.length;i++){
      var ch = formatted[i];
      if (ch===','){ out += '<span class="comma-sep">,</span>'; }
      else {
        var placeIdx = raw.length-1-ptr;
        var cls = idxArr.indexOf(placeIdx)>-1 ? 'digit-box num-highlight' : 'digit-box';
        out += '<span class="'+cls+'" data-place="'+placeIdx+'">'+ch+'</span>';
        ptr++;
      }
    }
    out += '</div>';
    return out;
  }
  function numWithHighlight(num, hlIdx){
    var formatted = fmt(num);
    var raw = String(num);
    var ptr = 0;
    var out = '';
    for (var i=0;i<formatted.length;i++){
      var ch = formatted[i];
      if (ch===','){ out += ch; }
      else {
        var placeIdx = raw.length-1-ptr;
        out += placeIdx===hlIdx ? '<span class="num-highlight">'+ch+'</span>' : ch;
        ptr++;
      }
    }
    return out;
  }

  /* ================= INTERACTION WIRING (shared by case mode + trail mode) ================= */
  function wireInteractive(q, onAnswered){
    if (q.type==='click-digit'){
      document.querySelectorAll('.digit-box').forEach(function(el){
        el.addEventListener('click', function(){
          if (state.answered) return;
          var placeIdx = parseInt(el.getAttribute('data-place'),10);
          var correct = placeIdx === q.targetPlaceIdx;
          document.querySelectorAll('.digit-box').forEach(function(d){ d.classList.remove('picked'); });
          el.classList.add('picked');
          onAnswered(correct, q.explain());
        });
      });
    } else if (q.type==='value-compare' || q.type==='mcq-simple'){
      document.querySelectorAll('#optGrid .opt-btn').forEach(function(btn){
        btn.addEventListener('click', function(){
          if (state.answered) return;
          var key = btn.getAttribute('data-key');
          var correct = key === q.correctKey;
          document.querySelectorAll('#optGrid .opt-btn').forEach(function(b){
            b.disabled = true;
            if (b.getAttribute('data-key')===q.correctKey) b.classList.add('is-correct');
          });
          if (!correct) btn.classList.add('is-wrong');
          onAnswered(correct, q.explain());
        });
      });
    } else if (q.type==='multiselect'){
      var picked = [];
      document.querySelectorAll('#optGrid .opt-btn').forEach(function(btn){
        btn.addEventListener('click', function(){
          if (state.answered) return;
          var key = btn.getAttribute('data-key');
          var idx = picked.indexOf(key);
          if (idx>-1){ picked.splice(idx,1); btn.classList.remove('chosen'); btn.querySelector('.chk').textContent='☐'; }
          else { picked.push(key); btn.classList.add('chosen'); btn.querySelector('.chk').textContent='☑'; }
        });
      });
      document.getElementById('checkBtn').addEventListener('click', function(){
        if (state.answered) return;
        var correctSet = q.correctKeys.slice().sort();
        var pickedSet = picked.slice().sort();
        var correct = JSON.stringify(correctSet)===JSON.stringify(pickedSet);
        document.querySelectorAll('#optGrid .opt-btn').forEach(function(b){
          b.disabled = true;
          var k = b.getAttribute('data-key');
          if (q.correctKeys.indexOf(k)>-1) b.classList.add('is-correct');
          else if (picked.indexOf(k)>-1) b.classList.add('is-wrong');
        });
        onAnswered(correct, q.explain());
      });
    } else if (q.type==='true-false'){
      document.querySelectorAll('#tfRow .tf-btn').forEach(function(btn){
        btn.addEventListener('click', function(){
          if (state.answered) return;
          var val = btn.getAttribute('data-v')==='true';
          var correct = val === q.correctAnswer;
          document.querySelectorAll('#tfRow .tf-btn').forEach(function(b){ b.disabled=true; });
          btn.classList.add(correct ? 'is-correct':'is-wrong');
          onAnswered(correct, q.explain());
        });
      });
    } else if (q.type==='order'){
      var picks = [];
      document.querySelectorAll('#orderRow .order-tile').forEach(function(tile){
        tile.addEventListener('click', function(){
          if (state.answered) return;
          var v = parseInt(tile.getAttribute('data-v'),10);
          if (picks.indexOf(v)>-1) return;
          picks.push(v);
          var slot = document.createElement('span');
          slot.className='slot'; slot.textContent = picks.length;
          tile.appendChild(slot);
          tile.classList.add('locked');
          if (picks.length === q.numbers.length){
            var correct = JSON.stringify(picks)===JSON.stringify(q.correctOrder);
            onAnswered(correct, q.explain());
          }
        });
      });
      document.getElementById('clearOrder').addEventListener('click', function(){
        if (state.answered) return;
        picks = [];
        document.querySelectorAll('#orderRow .order-tile').forEach(function(tile){
          tile.classList.remove('locked');
          var s = tile.querySelector('.slot'); if (s) s.remove();
        });
      });
    } else if (q.type==='symbol'){
      document.querySelectorAll('#symRow .symbol-btn').forEach(function(btn){
        btn.addEventListener('click', function(){
          if (state.answered) return;
          var v = btn.getAttribute('data-v');
          var correct = v === q.correctKey;
          document.querySelectorAll('#symRow .symbol-btn').forEach(function(b){ b.disabled=true; });
          btn.classList.add(correct ? 'is-correct':'is-wrong');
          onAnswered(correct, q.explain());
        });
      });
    }
  }

  function finishAnswer(correct, explainText){
    state.answered = true;
    if (correct){ state.score++; state.streak++; } else { state.streak = 0; }

    var cf = document.getElementById('caseFile');
    var stamp = document.createElement('div');
    stamp.className = 'stamp ' + (correct ? 'ok':'no');
    stamp.textContent = correct ? 'Case Matches!' : 'Re-examine';
    cf.appendChild(stamp);

    var explainBox = document.createElement('div');
    explainBox.className = 'explain-box';
    explainBox.textContent = explainText;
    cf.appendChild(explainBox);

    var nextBtn = document.createElement('button');
    nextBtn.className = 'next-btn';
    nextBtn.textContent = (state.qIndex+1 < state.total) ? 'Next Clue →' : 'See Case Summary →';
    nextBtn.addEventListener('click', function(){
      state.qIndex++;
      if (state.qIndex >= state.total){ renderSummary(); }
      else { nextQuestion(); }
    });
    cf.appendChild(nextBtn);
  }

  /* ================= SUMMARY ================= */
  function renderSummary(){
    var mode = MODES.filter(function(m){return m.id===state.modeId;})[0];
    var pct = Math.round((state.score/state.total)*100);
    var rank, note;
    if (pct===100){ rank='Ace Investigator'; note='Every clue matched. Case fully cracked!'; }
    else if (pct>=90){ rank='Master Detective'; note='Sharp work — almost every clue matched.'; }
    else if (pct>=75){ rank='Detective'; note='Solid case work. A couple of clues to revisit.'; }
    else if (pct>=50){ rank='Junior Detective'; note='Good progress — reopen this file for more practice.'; }
    else { rank='Rookie Detective'; note='Every detective starts here. Try this case again — new numbers, same skill.'; }

    if (pct>=75) solvedCases[state.modeId] = true;
    state.badges = Object.keys(solvedCases).length;
    document.getElementById('badgeNum').textContent = state.badges;

    var html = '<div class="summary">';
    html += '<div class="stamp-big">Case Closed</div>';
    html += '<p class="rank">'+rank+'</p>';
    html += '<p class="rank-note">'+note+'</p>';
    html += '<div class="stat-row">' +
      '<div class="stat"><div class="n">'+state.score+'/'+state.total+'</div><div class="l">Clues Solved</div></div>' +
      '<div class="stat"><div class="n">'+pct+'%</div><div class="l">Accuracy</div></div>' +
      '</div>';
    html += '<div class="summary-btns">' +
      '<button class="check-btn" id="replayBtn">Reopen This Case</button>' +
      '<button class="next-btn" id="homeBtn">Back to Case Files</button>' +
      '</div>';
    html += '</div>';
    document.getElementById('app').innerHTML = html;
    document.getElementById('replayBtn').addEventListener('click', function(){ startMode(mode.id); });
    document.getElementById('homeBtn').addEventListener('click', function(){ state.screen='home'; renderHome(); });
  }

  /* ================= TRAIL MODE (Case No. 08) ================= */
  function genTrailSequence(){
    var ids = MODES.map(function(m){ return m.id; });
    var seq = shuffle(ids); // all 7 skills, random order
    while (seq.length < TRAIL_LENGTH){ seq.push(choice(ids)); }
    return seq.slice(0, TRAIL_LENGTH);
  }

  function buildTrailMapSVG(n, currentIdx){
    var W=760, H=170;
    var xStep = (W-60)/(n-1);
    var pts = [];
    for (var i=0;i<n;i++){
      pts.push({ x: 30+i*xStep, y: (i%2===0) ? 42 : 128 });
    }
    var pathAll = pts.map(function(p){ return p.x+','+p.y; }).join(' ');
    var progressPts = pts.slice(0, currentIdx+1).map(function(p){ return p.x+','+p.y; }).join(' ');

    var svg = '<div class="trail-map-wrap"><svg viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg">';
    svg += '<polyline points="'+pathAll+'" fill="none" stroke="#cbb98d" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round"/>';
    if (currentIdx>0) svg += '<polyline points="'+progressPts+'" fill="none" stroke="#3E7C7B" stroke-width="4" stroke-linecap="round"/>';
    pts.forEach(function(p,i){
      var st = i<currentIdx ? 'done' : (i===currentIdx ? 'current' : 'future');
      var fill = st==='done' ? '#3E7C7B' : (st==='current' ? '#D9A441' : '#F5EFE0');
      var stroke = st==='future' ? '#cbb98d' : '#16233A';
      var r = st==='current' ? 15 : 12;
      svg += '<circle cx="'+p.x+'" cy="'+p.y+'" r="'+r+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="2"/>';
      var content = st==='done' ? '\u2713' : String(i+1);
      var textColor = st==='future' ? '#a89568' : (st==='done' ? '#ffffff' : '#241a08');
      svg += '<text x="'+p.x+'" y="'+(p.y+4)+'" text-anchor="middle" font-family="Baloo 2, sans-serif" font-weight="800" font-size="'+(st==='current'?13:11)+'" fill="'+textColor+'">'+content+'</text>';
      if (i===0 || i===n-1){
        var labelY = p.y<80 ? p.y-20 : p.y+26;
        svg += '<text x="'+p.x+'" y="'+labelY+'" class="trail-node-label">'+(i===0?'START':'FINISH')+'</text>';
      }
    });
    svg += '</svg></div>';
    return svg;
  }

  function startTrail(){
    state.screen='trail';
    state.trailSeq = genTrailSequence();
    state.trailIdx = 0;
    state.trailWrongTurns = 0;
    nextTrailNode();
  }

  function nextTrailNode(){
    state.answered = false;
    var modeId = state.trailSeq[state.trailIdx];
    state._trailMode = MODES.filter(function(m){ return m.id===modeId; })[0];
    state.current = state._trailMode.gen();
    renderTrail();
  }

  function renderTrail(){
    var mode = state._trailMode;
    var q = state.current;
    var html = '';
    html += '<div class="playbar">';
    html += '<button class="back-btn" id="backBtn">← Case Files</button>';
    html += '<span class="progress-pill">Stop '+(state.trailIdx+1)+' of '+TRAIL_LENGTH+'</span>';
    html += '<span class="streak-pill">🚧 Wrong turns: '+state.trailWrongTurns+'</span>';
    html += '</div>';

    html += buildTrailMapSVG(TRAIL_LENGTH, state.trailIdx);
    html += '<p class="trail-legend">' +
      '<span><span class="trail-dot" style="background:#3E7C7B;"></span>Solved</span>' +
      '<span><span class="trail-dot" style="background:#D9A441;"></span>You are here</span>' +
      '<span><span class="trail-dot" style="background:#F5EFE0;border:1px solid #cbb98d;"></span>Ahead</span>' +
      '</p>';

    html += '<div class="case-file" id="caseFile">';
    html += '<p class="q-mode-label">'+mode.icon+' '+mode.title+'</p>';
    html += '<div class="q-prompt">'+q.prompt+'</div>';
    html += buildInteractiveBody(q);
    html += '</div>';

    document.getElementById('app').innerHTML = html;
    document.getElementById('backBtn').addEventListener('click', function(){ state.screen='home'; renderHome(); });
    wireInteractive(q, trailAnswered);
  }

  function trailAnswered(correct, explainText){
    state.answered = true;
    if (!correct) state.trailWrongTurns++;

    var cf = document.getElementById('caseFile');
    var stamp = document.createElement('div');
    stamp.className = 'stamp ' + (correct ? 'ok':'no');
    stamp.textContent = correct ? 'Right Way!' : 'Wrong Turn';
    cf.appendChild(stamp);

    var explainBox = document.createElement('div');
    explainBox.className = 'explain-box';
    explainBox.textContent = explainText;
    cf.appendChild(explainBox);

    var isLast = state.trailIdx+1 >= TRAIL_LENGTH;
    var nextBtn = document.createElement('button');
    nextBtn.className = 'next-btn';
    nextBtn.textContent = isLast ? 'Reach the Finish →' : 'Continue the Trail →';
    nextBtn.addEventListener('click', function(){
      state.trailIdx++;
      if (state.trailIdx >= TRAIL_LENGTH){ renderTrailFinale(); }
      else { nextTrailNode(); }
    });
    cf.appendChild(nextBtn);
  }

  function renderTrailFinale(){
    var wrong = state.trailWrongTurns;
    var perfect = wrong===0;
    solvedCases['trail'] = true;
    state.badges = Object.keys(solvedCases).length;
    document.getElementById('badgeNum').textContent = state.badges;

    var rank, note;
    if (perfect){ rank='Ace Investigator'; note='You followed the whole trail without a single wrong turn.'; }
    else if (wrong<=2){ rank='Master Detective'; note='A couple of wrong turns, but you found the way through.'; }
    else if (wrong<=5){ rank='Detective'; note='You made it to the end — walk the trail again to tighten it up.'; }
    else { rank='Junior Detective'; note='You reached the finish. Every trail gets easier with another walk.'; }

    var html = '<div class="summary">';
    html += '<div class="stamp-big">Case Closed</div>';
    html += '<p class="rank">'+rank+'</p>';
    html += '<p class="rank-note">'+note+'</p>';
    html += '<div class="stat-row">' +
      '<div class="stat"><div class="n">'+TRAIL_LENGTH+'/'+TRAIL_LENGTH+'</div><div class="l">Stops Reached</div></div>' +
      '<div class="stat"><div class="n">'+wrong+'</div><div class="l">Wrong Turns</div></div>' +
      '</div>';
    html += '<div class="summary-btns">' +
      '<button class="check-btn" id="replayBtn">Walk the Trail Again</button>' +
      '<button class="next-btn" id="homeBtn">Back to Case Files</button>' +
      '</div>';
    html += '</div>';
    document.getElementById('app').innerHTML = html;
    document.getElementById('replayBtn').addEventListener('click', startTrail);
    document.getElementById('homeBtn').addEventListener('click', function(){ state.screen='home'; renderHome(); });
  }

  renderHome();
})();
</script>
</body>
</html>
