<!DOCTYPE html>
<html lang="en" data-theme="ela">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Words Division — Detective Agency</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕵️</text></svg>">
<!-- Fonts are self-hosted and declared in base.css. This used to be a
     render-blocking <link> to fonts.googleapis.com — a whole extra origin
     (DNS + TCP + TLS) before the first pixel, which is what the homepage
     already avoided. Baloo 2 is preloaded because base.css has to download
     and parse before the browser would otherwise discover it. -->
<link rel="preload" as="font" type="font/woff2" href="../../assets/fonts/baloo2-latin1.woff2" crossorigin>
<!-- ELA question styles. Imports game.css and base.css itself (see its
     header), so this one link carries the whole chain in the right
     cascade order. -->
<link rel="stylesheet" href="../../assets/css/ela.css">
</head>
<body>
<div class="agency">
  <div class="masthead">
    <div class="masthead-top">
      <div>
        <a class="home-link" href="../../">← All Divisions</a>
        <p class="eyebrow">Detective Agency · Est. 2026</p>
        <h1 class="title">Words Division</h1>
        <p class="subtitle">Every passage is a clue. Figure out what the author really wants you to think, feel, or notice.</p>
      </div>
      <div class="badge-counter">
        <div class="num" id="badgeNum">0</div>
        <div class="lbl">Cases<br>Closed</div>
      </div>
    </div>
  </div>
  <noscript>
    <p class="load-error">This case file needs JavaScript switched on — the
    questions are generated fresh in your browser each time you open it.</p>
  </noscript>
  <!-- The engine renders every screen in here. It doubles as the main
       landmark so a screen reader can skip straight to the question. -->
  <main id="app"></main>
</div>

<script type="module">
// One entry: the engine and the question content (which imports the shared
// pool-drawing question-kit itself). Vite bundles this block and everything
// it imports into the page's hashed entry chunk.
import DetectiveGame from '../../assets/js/game-engine.js';
import WORDS_QUESTIONS from '../../assets/js/words-questions.js';
DetectiveGame.start(WORDS_QUESTIONS);
</script>
</body>
</html>
