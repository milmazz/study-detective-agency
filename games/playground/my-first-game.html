<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My First Game - Bunny's Carrot Hunt</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!--
  ============================================================
  HI! This whole file is YOUR game. There's nothing fancy here
  on purpose -- everything a browser needs (the page, the
  colors, and the brain that makes it move) is in this ONE
  file, so you can read top to bottom and see how it all fits
  together. No installing anything: just double-click this
  file and it opens and plays.

  A game (any game, even the big fancy ones) is really just
  three ingredients:

    1. HTML  -- the STAGE. What's on the screen: boxes, text,
               buttons. No movement, no colors yet, just shapes.
    2. CSS   -- the COSTUMES. Makes the stage look nice: colors,
               sizes, where things sit.
    3. JS    -- the BRAIN. The part that makes things actually
               DO something: move, count points, react when you
               press a key.

  Scroll down -- each ingredient has its own big labeled
  section below. Try changing a number or a color and reload
  the page in your browser to see what happens. You can't
  break anything permanently -- it's just a text file!
  ============================================================
-->

<style>
  /* ============================================================
     INGREDIENT 2: THE COSTUMES (CSS)
     CSS answers one question over and over: "how should this
     THING look?" You pick a thing (like .player) and then list
     its style, one line per property.
     ============================================================ */

  body {
    font-family: system-ui, sans-serif;
    background: #ffe3ef;
    color: #6b4a5b;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px;
  }

  h1 { margin-bottom: 4px; }
  p.tip { color: #a5728a; max-width: 480px; text-align: center; }

  /* The scoreboard row above the game */
  #scoreboard {
    font-size: 1.3em;
    font-weight: bold;
    margin: 8px 0;
    color: #ff8fab;
  }

  /* The game area is the "stage" the carrots fall through.
     position: relative means "everything inside that says
     position: absolute measures itself from THIS box's edges,
     not the whole page." */
  #game-area {
    position: relative;
    width: 480px;
    max-width: 92vw;
    height: 360px;
    background: linear-gradient(#bfe9ff 0%, #bfe9ff 75%, #b8e8a0 75%, #9fd987 100%);
    border: 4px solid #ff8fab;
    border-radius: 12px;
    overflow: hidden;
  }

  /* The player (your bunny!) sits near the bottom and slides
     left/right. */
  #player {
    position: absolute;
    bottom: 10px;
    font-size: 2.4em;
    /* left gets set by JavaScript below -- CSS just says how it
       looks, JS decides where. */
    transition: left 0.05s linear;
  }

  /* Every falling carrot gets this class. Their exact position
     (top/left) is set one-by-one by JavaScript, since every
     carrot is in a different spot. */
  .carrot {
    position: absolute;
    font-size: 1.6em;
  }

  #controls { margin-top: 12px; }
  #controls button {
    font-size: 1.4em;
    padding: 8px 20px;
    margin: 0 8px;
    border-radius: 8px;
    border: none;
    background: #ff8fab;
    cursor: pointer;
  }
  #controls button:active { background: #ff6b95; }

  /* The "You filled the basket!" win screen. It starts hidden
     (display: none) and JS switches it to visible when you win. */
  #win-screen {
    position: absolute;
    inset: 0;
    background: rgba(255, 227, 239, 0.97);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 12px;
  }
  #win-screen.show { display: flex; }
  #win-screen button {
    font-size: 1.1em;
    padding: 8px 18px;
    border-radius: 8px;
    border: none;
    background: #ff8fab;
    cursor: pointer;
  }
</style>
</head>
<body>

<!-- ============================================================
     INGREDIENT 1: THE STAGE (HTML)
     This is just a list of boxes. Nothing moves by itself --
     it's like a stage before the actors show up. Notice each
     important box has an id="..." so the JavaScript below can
     find it and control it later.
     ============================================================ -->

<h1>🐰 Bunny's Carrot Hunt</h1>
<p class="tip">Move the bunny with the ⬅️➡️ arrow keys
  (or the buttons below) and catch 10 falling carrots to fill the basket!</p>

<div id="scoreboard">Carrots: <span id="score">0</span> / 10 🥕</div>

<div id="game-area">
  <div id="player">🐰</div>

  <div id="win-screen">
    <h2>🧺 Basket Full! 🎉</h2>
    <p>Yummy! You caught every carrot. Great job, bunny!</p>
    <button id="play-again">Play Again</button>
  </div>
</div>

<div id="controls">
  <button id="left-btn">⬅️</button>
  <button id="right-btn">➡️</button>
  <button id="music-btn">🔊 Music: On</button>
</div>

<script>
  // ============================================================
  // INGREDIENT 3: THE BRAIN (JavaScript)
  // Everything above just sits there until code tells it what
  // to do. JS is a list of instructions the computer runs, plus
  // "when this happens, do that" rules called event listeners.
  // ============================================================

  // --- Step 1: grab the boxes from the stage so we can control them ---
  // A "variable" is just a labeled box that holds something --
  // here, each one holds a reference to a piece of HTML.
  var gameArea   = document.getElementById('game-area');
  var player     = document.getElementById('player');
  var scoreLabel = document.getElementById('score');
  var winScreen  = document.getElementById('win-screen');

  // --- Step 2: the game's "state" -- numbers that change as you play ---
  var playerX  = 220;   // bunny's left position in pixels
  var score    = 0;     // carrots caught so far
  var goal     = 10;    // how many carrots to win
  var gameOver = false;

  var AREA_WIDTH  = 480;
  var PLAYER_WIDTH = 40;
  var MOVE_STEP   = 22;  // how far one key press/button click moves you

  // Draw the bunny at wherever playerX currently is.
  // Functions are little named recipes: "do these steps" -- you
  // just say updatePlayer() later instead of repeating them.
  function updatePlayer() {
    player.style.left = playerX + 'px';
  }
  updatePlayer(); // run it once so the bunny shows up in the right spot

  function movePlayer(dx) {
    if (gameOver) return; // no moving after you've already won
    playerX += dx;
    // clamp() keeps a number from going below min or above max --
    // here it stops the bunny sliding off either edge.
    if (playerX < 0) playerX = 0;
    if (playerX > AREA_WIDTH - PLAYER_WIDTH) playerX = AREA_WIDTH - PLAYER_WIDTH;
    updatePlayer();
  }

  // --- Step 3: react to the player pressing arrow keys ---
  // "addEventListener" is the "when this happens, do that" rule.
  // Here: whenever ANY key is pressed anywhere on the page, run
  // this function and check which key it was.
  document.addEventListener('keydown', function (event) {
    if (event.key === 'ArrowLeft')  movePlayer(-MOVE_STEP);
    if (event.key === 'ArrowRight') movePlayer(MOVE_STEP);
  });

  // The on-screen buttons do the exact same thing as the keys --
  // they just call the same movePlayer() function.
  document.getElementById('left-btn').addEventListener('click', function () {
    movePlayer(-MOVE_STEP);
  });
  document.getElementById('right-btn').addEventListener('click', function () {
    movePlayer(MOVE_STEP);
  });

  // --- Step 4: making carrots fall ---
  // Every so often we create a brand new carrot element, drop it
  // into the game area at a random left position, and let it
  // fall. This function makes ONE carrot; we'll call it on a timer.
  function spawnCarrot() {
    if (gameOver) return;

    var carrot = document.createElement('div');
    carrot.className = 'carrot';
    carrot.textContent = '🥕';

    // Math.random() gives a decimal between 0 and 1. Multiplying
    // it stretches that into "somewhere across the game area."
    var startX = Math.random() * (AREA_WIDTH - 24);
    carrot.style.left = startX + 'px';
    carrot.style.top = '-30px'; // start just above the visible area

    gameArea.appendChild(carrot);

    var carrotY = -30;
    var fallSpeed = 2 + Math.random() * 2; // pixels per tick -- some fall faster than others

    // setInterval repeats a function forever, every X milliseconds,
    // until we tell it to stop with clearInterval.
    var fallTimer = setInterval(function () {
      carrotY += fallSpeed;
      carrot.style.top = carrotY + 'px';

      if (didPlayerCatch(startX, carrotY)) {
        clearInterval(fallTimer);
        carrot.remove();
        catchCarrot();
        return;
      }

      // Carrot reached the bottom without being caught -- just
      // remove it, no penalty. This is a low-pressure game!
      if (carrotY > 320) {
        clearInterval(fallTimer);
        carrot.remove();
      }
    }, 20);
  }

  // Checks whether the falling carrot's position overlaps the
  // bunny's position -- close enough on both left/right (x) and
  // up/down (y) counts as a catch.
  function didPlayerCatch(carrotX, carrotY) {
    var closeEnoughX = Math.abs(carrotX - playerX) < 34;
    var playerIsNear = carrotY > 300 && carrotY < 340;
    return closeEnoughX && playerIsNear;
  }

  function catchCarrot() {
    score += 1;
    scoreLabel.textContent = score;
    if (score >= goal) {
      winGame();
    }
  }

  function winGame() {
    gameOver = true;
    winScreen.classList.add('show');
  }

  // A carrot spawns every 900 milliseconds, for as long as the
  // page is open.
  setInterval(spawnCarrot, 900);

  // --- Step 5: background music, with an on/off button ---
  // Quick note: I can't drop in an actual copyrighted song (like a
  // real track from a real artist) -- games aren't allowed to just
  // grab music like that without permission. So instead here's a
  // tiny, cheerful tune made entirely out of code, using something
  // built into every browser called the Web Audio API. It plays one
  // note at a time, forever, like a happy little music box.
  var audioCtx = null;
  var musicOn = true;
  var melodyStep = 0;

  // Each pair is [note frequency in Hz, how long to hold it in seconds].
  // These numbers are just musical notes -- try swapping a few and
  // reload to hear your own tune!
  var melody = [
    [523.25, 0.28], [659.25, 0.28], [783.99, 0.28], [659.25, 0.28],
    [523.25, 0.28], [587.33, 0.28], [659.25, 0.56],
    [493.88, 0.28], [523.25, 0.28], [587.33, 0.28], [523.25, 0.28],
    [493.88, 0.28], [440.00, 0.28], [493.88, 0.56]
  ];

  function playNextNote() {
    var note = melody[melodyStep];
    melodyStep = (melodyStep + 1) % melody.length;

    if (musicOn && audioCtx) {
      // An oscillator makes the sound; a gain node controls its
      // volume. Ramping the gain down to (almost) zero over the
      // note's length is what makes it fade instead of click off.
      var osc = audioCtx.createOscillator();
      var volume = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.value = note[0];
      volume.gain.setValueAtTime(0.06, audioCtx.currentTime);
      volume.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + note[1]);
      osc.connect(volume);
      volume.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + note[1]);
    }

    setTimeout(playNextNote, note[1] * 1000);
  }

  // Browsers won't let a page play sound until you've clicked or
  // pressed something on it first -- that's a privacy rule, not a
  // bug. So we create the AudioContext (and start the music loop)
  // the very first time the player moves or clicks anything.
  function unlockAudioOnce() {
    if (audioCtx) return;
    var AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) return; // this browser can't play sound -- game still works fine without it
    audioCtx = new AudioContextClass();
    playNextNote();
  }
  document.addEventListener('keydown', unlockAudioOnce, { once: true });
  document.addEventListener('click', unlockAudioOnce, { once: true });

  var musicBtn = document.getElementById('music-btn');
  musicBtn.addEventListener('click', function () {
    musicOn = !musicOn;
    musicBtn.textContent = musicOn ? '🔊 Music: On' : '🔇 Music: Off';
  });

  // --- Step 6: Play Again resets everything back to the start ---
  document.getElementById('play-again').addEventListener('click', function () {
    score = 0;
    gameOver = false;
    scoreLabel.textContent = score;
    winScreen.classList.remove('show');
    // Remove any carrots still on screen from the last round.
    var leftoverCarrots = document.querySelectorAll('.carrot');
    leftoverCarrots.forEach(function (c) { c.remove(); });
  });

  // ============================================================
  // Ideas to try next (change a number above, save, reload!):
  //   - Change `goal` to 20 -- now you need more carrots to win.
  //   - Change `MOVE_STEP` to 60 -- the bunny zooms sideways.
  //   - Change the emoji in carrot.textContent to something else,
  //     like 🍓 or 🧀 or 🍩.
  //   - Change the emoji in #player to 🐱 or 🐻 for a different pet.
  //   - Change `setInterval(spawnCarrot, 900)` to 400 -- carrots
  //     fall way more often. Try 3000 for the opposite!
  //   - Change some of the numbers in the `melody` list above to
  //     hear a different tune. 440 is the note A, 493.88 is B,
  //     523.25 is C, and so on up a musical scale.
  // ============================================================
</script>

</body>
</html>
