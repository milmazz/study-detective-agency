<!DOCTYPE html>
<html lang="en" data-theme="math">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Ledger Files — Detective Agency</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧾</text></svg>">
<!-- See numeration-detective-agency.html for why fonts are self-hosted and
     preloaded rather than linked to fonts.googleapis.com. -->
<link rel="preload" as="font" type="font/woff2" href="../../assets/fonts/baloo2-latin1.woff2" crossorigin>
<!-- This game's own question furniture: the typed answer, the chip groups,
     and the miniature strip diagrams drawn inside option buttons. Imports
     word-problems.css (shared with the Missing Evidence Files), game.css
     and base.css itself (see its header), so this one link carries the
     whole chain in the right cascade order. -->
<link rel="stylesheet" href="../../assets/css/ledger.css">
</head>
<body>
<div class="agency">
  <div class="masthead">
    <div class="masthead-top">
      <div>
        <a class="home-link" href="../../">← All Divisions</a>
        <p class="eyebrow">Detective Agency · Est. 2026</p>
        <h1 class="title">The Ledger Files</h1>
        <p class="subtitle">Adding and subtracting big numbers, the equation that fits the story, the diagram that matches it, and a quick estimate when close enough will do.</p>
      </div>
      <div class="badge-counter">
        <div class="num" id="badgeNum">0</div>
        <div class="lbl">Cases<br>Closed</div>
      </div>
    </div>
  </div>
  <noscript>
    <p class="load-error">This case file needs JavaScript switched on — the
    questions are generated fresh in your browser each time you open it.</p>
  </noscript>
  <!-- The engine renders every screen in here. It doubles as the main
       landmark so a screen reader can skip straight to the question. -->
  <main id="app"></main>
</div>

<script type="module">
// One entry: the engine, the typed-answer/chip-group question types this game
// registers (a side effect of the import), and the question content. Vite
// bundles this block and everything it imports into the page's hashed entry chunk.
import DetectiveGame from '../../assets/js/game-engine.js';
import '../../assets/js/ledger-types.js';
import LEDGER_QUESTIONS from '../../assets/js/ledger-questions.js';
DetectiveGame.start(LEDGER_QUESTIONS);
</script>
</body>
</html>
