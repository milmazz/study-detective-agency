<html><head><meta charset="utf-8">

<svg id="v" width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
/* ---------- palette (Texas Trail page) ---------- */
const C = { ink:'#1D3350', muted:'#55708F', line:'#C6DCF0', accent:'#1F74C9', soft:'#DCEEFF', pop:'#FFBE2E', popSoft:'#FFF2CC',
  good:'#2B9A57', goodSoft:'#DAF3E3', goodText:'#1D7240', oops:'#D9543F', oopsSoft:'#FDE3DE', oopsText:'#AC3523',
  chick:'#FFD43B', hat:'#B9783F', beak:'#FF8A2B', blush:'#FF9FB0', land:'#F7EBC8', land2:'#EAD9A6', river:'#5BB3F0', trail:'#9CC3E6',
  shell:'#B9987C', shellDark:'#8C6F57', skin:'#E9C9B0' };

/* ---------- characters ---------- */
function pepita(t, x, y, s, o = {}){
  const m = mouthAt('pepita', t);
  const blink = (t % 3.9) < .13;
  const bob = Math.sin(t * 2.4) * 3 - m * 4;
  const eyes = o.happy ? `<path d="M44 66q6-7 12 0M68 66q6-7 12 0" stroke="${C.ink}" stroke-width="4" fill="none" stroke-linecap="round"/>`
    : blink ? `<path d="M44 66h12M68 66h12" stroke="${C.ink}" stroke-width="4" stroke-linecap="round"/>`
    : `<circle cx="50" cy="66" r="6" fill="${C.ink}"/><circle cx="74" cy="66" r="6" fill="${C.ink}"/><circle cx="52" cy="64" r="2.2" fill="#fff"/><circle cx="76" cy="64" r="2.2" fill="#fff"/>`;
  const open = m > .12 ? m : 0;
  const beak = `<path d="M55 74l7 ${6 - open * 2} 7-${6 - open * 2}z" fill="${C.beak}" stroke="${C.ink}" stroke-width="2" stroke-linejoin="round"/>`
    + (open ? `<path d="M57 ${78 + open * 2}l5 ${4 + open * 5} 5-${4 + open * 5}z" fill="${C.beak}" stroke="${C.ink}" stroke-width="2" stroke-linejoin="round"/>` : '');
  const wing = o.wave ? Math.sin(t * 12) * 18 : 0;
  return `<g transform="translate(${x} ${y + bob}) scale(${s})">
  <ellipse cx="62" cy="120" rx="40" ry="5" fill="${C.ink}" opacity=".12"/>
  <path d="M46 116v-10M78 116v-10M40 117h12M72 117h12" stroke="${C.beak}" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="62" cy="72" rx="44" ry="38" fill="${C.chick}" stroke="${C.ink}" stroke-width="3.5"/>
  <path d="M20 78q-10 6-4 16q10-2 12-10" fill="${C.chick}" stroke="${C.ink}" stroke-width="3" stroke-linejoin="round"/>
  <g transform="rotate(${-wing} 104 80)"><path d="M104 78q10 6 4 16q-10-2-12-10" fill="${C.chick}" stroke="${C.ink}" stroke-width="3" stroke-linejoin="round"/></g>
  <ellipse cx="62" cy="40" rx="42" ry="7" fill="${C.hat}" stroke="${C.ink}" stroke-width="3"/>
  <path d="M36 40q2-26 26-26t26 26z" fill="${C.hat}" stroke="${C.ink}" stroke-width="3" stroke-linejoin="round"/>
  <path d="M38 34h48" stroke="${C.oops}" stroke-width="5"/>
  <path d="M84 30q14-14 20-6q-8 0-14 10z" fill="${C.oops}" stroke="${C.ink}" stroke-width="2" stroke-linejoin="round"/>
  ${eyes}
  <ellipse cx="38" cy="78" rx="7" ry="4.5" fill="${C.blush}"/><ellipse cx="86" cy="78" rx="7" ry="4.5" fill="${C.blush}"/>
  ${beak}</g>`;
}

/* Dilly: nine-banded armadillo, drawn facing right; origin = feet centre. o.curl 0..1 tucks head and tail. */
function dilly(t, x, y, s, o = {}){
  const m = mouthAt('dilly', t);
  const face = o.face || -1;
  const blink = ((t + 1.1) % 3.6) < .12;
  const c = o.curl || 0;
  const hop = (o.still ? 0 : Math.abs(Math.sin(t * 5)) * 1.5) + m * 3;
  const bands = [52, 62, 72, 82, 92, 102].map(bx => `<path d="M${bx} ${24 + Math.abs(bx - 72) * .25}q-4 26 0 ${50 - Math.abs(bx - 72) * .25}" stroke="${C.shellDark}" stroke-width="2.5" fill="none"/>`).join('');
  const mouth = m > .12 ? `<ellipse cx="150" cy="${76 + m}" rx="4" ry="${1.5 + m * 4}" fill="#7A2D4A" stroke="${C.ink}" stroke-width="1.8"/>` : `<path d="M144 76q5 3 9 0" stroke="${C.ink}" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
  const eye = blink ? `<path d="M131 60h8" stroke="${C.ink}" stroke-width="3" stroke-linecap="round"/>` : `<circle cx="135" cy="60" r="4.5" fill="${C.ink}"/><circle cx="136.5" cy="58.5" r="1.6" fill="#fff"/>`;
  return `<g transform="translate(${x} ${y - hop}) rotate(${o.rot || 0} 0 ${-45 * s}) scale(${s * face} ${s}) translate(-80 -92)">
  <ellipse cx="78" cy="94" rx="64" ry="5" fill="${C.ink}" opacity=".12"/>
  <g transform="rotate(${c * 60} 22 72)"><path d="M24 66q-26 6 -40 24q20 -8 42 -14z" fill="${C.shell}" stroke="${C.ink}" stroke-width="3" stroke-linejoin="round"/>${[0, 1, 2].map(i => `<line x1="${14 - i * 9}" y1="${70 + i * 4}" x2="${12 - i * 9}" y2="${78 + i * 3}" stroke="${C.shellDark}" stroke-width="2"/>`).join('')}</g>
  ${[34, 52, 98, 114].map(lx => `<rect x="${lx}" y="${76 - c * 6}" width="12" height="${16 - c * 8}" rx="5" fill="${C.skin}" stroke="${C.ink}" stroke-width="2.5"/>`).join('')}
  <g transform="translate(${c * 8} ${c * 4})"><path d="M20 80Q18 22 72 18Q126 22 124 80Z" fill="${C.shell}" stroke="${C.ink}" stroke-width="3.5" stroke-linejoin="round"/>${bands}
  <path d="M20 80H124" stroke="${C.ink}" stroke-width="3.5" stroke-linecap="round"/></g>
  <g transform="rotate(${c * 70} 120 70)">
    <ellipse cx="122" cy="40" rx="6" ry="15" fill="${C.skin}" stroke="${C.ink}" stroke-width="2.5" transform="rotate(-12 122 40)"/>
    <ellipse cx="132" cy="42" rx="6" ry="14" fill="${C.skin}" stroke="${C.ink}" stroke-width="2.5" transform="rotate(10 132 42)"/>
    <path d="M114 58q14 -12 28 -2l18 14q6 6 -2 10l-22 4q-20 0 -22 -14z" fill="${C.shell}" stroke="${C.ink}" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="160" cy="72" r="4" fill="${C.ink}"/>
    ${eye}${mouth}
    <ellipse cx="140" cy="70" rx="5" ry="3" fill="${C.blush}"/>
  </g>
  ${o.holding || ''}</g>`;
}

/* ---------- this video's drawing helpers (shared ones are in lib/lib.js) ---------- */

/* ---------- Texas map ---------- */
const TX = [[-103.04,36.5],[-100.0,36.5],[-100.0,34.56],[-99.2,34.3],[-98.5,34.1],[-97.6,33.9],[-96.6,33.85],[-95.7,33.9],[-95.0,33.85],[-94.48,33.64],[-94.04,33.55],[-94.04,31.99],[-93.7,31.0],[-93.84,29.7],
  [-94.7,29.35],[-95.3,28.9],[-96.4,28.3],[-97.0,27.8],[-97.4,27.2],[-97.4,26.5],[-97.15,25.95],
  [-97.6,26.05],[-98.3,26.2],[-99.1,26.6],[-99.5,27.5],[-100.3,28.3],[-100.7,29.1],[-101.4,29.77],[-102.4,29.78],[-102.7,29.6],[-103.1,29.0],[-103.6,29.2],[-104.4,29.6],[-104.7,30.2],[-105.0,30.7],[-106.0,31.4],[-106.63,31.98],
  [-106.62,32.0],[-103.06,32.0]];
const RIO = TX.slice(20, 37);
const MAP = {x0: 640, y0: 92, k: 38};
const P = (lon, lat, M = MAP) => [M.x0 + (lon + 106.7) * M.k, M.y0 + (36.55 - lat) * M.k * 1.15];
const pts = (arr, M) => arr.map(([lo, la]) => P(lo, la, M).map(v => v.toFixed(1)).join(',')).join(' ');
function texasMap(op, o = {}){
  if (op <= 0) return '';
  const rivers = o.rivers ? [[[-99.5,33.2],[-98.2,32.4],[-97.1,31.5],[-96.3,30.2],[-95.4,28.9]], [[-101.5,32.5],[-99.8,31.6],[-97.75,30.27],[-96.8,29.5],[-96.0,28.6]], [[-98.6,29.6],[-98.2,29.0],[-97.5,28.6],[-96.9,28.3]]]
      .map(r => `<polyline points="${pts(r)}" fill="none" stroke="${C.river}" stroke-width="${3 + o.rivers * 3}" stroke-linecap="round" stroke-linejoin="round"/>`).join('') : '';
  return `<g opacity="${op}"><rect x="${MAP.x0 - 20}" y="${MAP.y0 - 10}" width="545" height="${480}" rx="24" fill="#CFE9FB"/>
    <polygon points="${pts(TX)}" fill="${C.land}" stroke="${C.ink}" stroke-width="3.5" stroke-linejoin="round"/>
    <polyline points="${pts(RIO)}" fill="none" stroke="${C.river}" stroke-width="${o.rivers ? 4 + o.rivers * 3 : 4}" stroke-linejoin="round"/>
    ${rivers}${txt(P(-99.5, 31)[0], P(-99.5, 31)[1], 'TEXAS', 34, {w: 800, fill: C.land2})}
    </g>`;
}
function route(arr, p, color){
  if (p <= 0) return '';
  const xy = arr.map(([lo, la]) => P(lo, la));
  const seg = []; let total = 0; for (let i = 1; i < xy.length; i++){ const d = Math.hypot(xy[i][0] - xy[i-1][0], xy[i][1] - xy[i-1][1]); seg.push(d); total += d; }
  let left = total * p; const out = [xy[0]];
  for (let i = 1; i < xy.length && left > 0; i++){ const f = Math.min(1, left / seg[i-1]); out.push([lerp(xy[i-1][0], xy[i][0], f), lerp(xy[i-1][1], xy[i][1], f)]); left -= seg[i-1]; }
  const head = out[out.length - 1];
  return `<polyline points="${out.map(q => q.join(',')).join(' ')}" fill="none" stroke="${color}" stroke-width="6" stroke-dasharray="12 9" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${head[0]}" cy="${head[1]}" r="9" fill="${color}" stroke="${C.ink}" stroke-width="2.5"/>`;
}
function pin(lon, lat, sc, color = C.oops){
  if (sc <= 0) return ''; const [x, y] = P(lon, lat);
  return `<g transform="translate(${x} ${y}) scale(${sc})"><path d="M0 0c-12 -18 -16 -24 -16 -32a16 16 0 0 1 32 0c0 8 -4 14 -16 32z" fill="${color}" stroke="${C.ink}" stroke-width="3"/><circle cy="-32" r="6" fill="#fff"/></g>`;
}
function mission(cx, cy, s){
  return `<g transform="translate(${cx} ${cy}) scale(${s})"><path d="M-70 0v-80h40v-30q30 -26 60 0v30h40v80z" fill="#F4E3C3" stroke="${C.ink}" stroke-width="4" stroke-linejoin="round"/>
    <path d="M-12 0v-40a12 12 0 0 1 24 0v40z" fill="#8A5A2B" stroke="${C.ink}" stroke-width="3"/><path d="M-10 -100a10 10 0 0 1 20 0v14h-20z" fill="#CFE9FB" stroke="${C.ink}" stroke-width="3"/>
    <path d="M-5 -96q5 -8 10 0v8h-10z" fill="${C.pop}" stroke="${C.ink}" stroke-width="2"/><path d="M0 -140v-18M-7 -151h14" stroke="${C.ink}" stroke-width="4" stroke-linecap="round"/>
    <rect x="-56" y="-62" width="18" height="22" rx="8" fill="#CFE9FB" stroke="${C.ink}" stroke-width="3"/><rect x="38" y="-62" width="18" height="22" rx="8" fill="#CFE9FB" stroke="${C.ink}" stroke-width="3"/></g>`;
}
function ship(x, y, s, label, sail, rock = 0){
  return `<g transform="translate(${x} ${y}) rotate(${rock}) scale(${s})"><path d="M-80 0h160l-26 34h-108z" fill="#8A5A2B" stroke="${C.ink}" stroke-width="4" stroke-linejoin="round"/>
    <path d="M0 0v-120" stroke="${C.ink}" stroke-width="5"/><path d="M4 -114q60 40 0 104z" fill="${sail}" stroke="${C.ink}" stroke-width="3.5"/><path d="M-4 -104q-50 34 0 90z" fill="#fff" stroke="${C.ink}" stroke-width="3.5"/>
    ${txt(0, 68, label, 26, {w: 800})}</g>`;
}
function wagon(x, y, s){
  return `<g transform="translate(${x} ${y}) scale(${s})"><path d="M-70 -30q0 -70 70 -70t70 70z" fill="#FFF8EA" stroke="${C.ink}" stroke-width="4"/><path d="M-30 -30q0 -66 30 -68M30 -30q0 -66 -30 -68" stroke="${C.line}" stroke-width="3" fill="none"/>
    <rect x="-80" y="-34" width="160" height="30" rx="6" fill="#A86B36" stroke="${C.ink}" stroke-width="4"/>
    ${[-50, 50].map(wx => `<g transform="translate(${wx} 6) rotate(${-x * 2})"><circle r="22" fill="#fff" stroke="${C.ink}" stroke-width="4"/><path d="M-22 0h44M0 -22v44M-15 -15l30 30M15 -15l-30 30" stroke="${C.ink}" stroke-width="2.5"/></g>`).join('')}</g>`;
}

/* ---------- background + chrome ---------- */
const VIDEO = { titles: {1: 'Hit the trail!', 2: 'Stop 1 · European explorers', 3: 'Stop 1 · Sources & maps', 4: 'Stop 2 · Spanish missions', 5: 'Stop 3 · Mexico & new settlers', 6: 'Stop 4 · Timeline', 7: 'Pop quiz!', 8: 'Happy trails!'}, icon: '🐣', label: 'Pepita’s Texas Trail' };
const SPEAKERS = { pepita: { name: 'Pepita', color: C.accent }, dilly: { name: 'Dilly', color: '#8C6F57' } };
function background(){
  return `<defs><pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="13" cy="13" r="2.2" fill="#D2EAFB"/></pattern></defs>
  <rect width="1280" height="720" fill="#E8F5FF"/><rect width="1280" height="720" fill="url(#dots)"/>
  <path d="M0 575q160 -40 320 -10t320 0t320 -14t320 10V720H0z" fill="${C.land}"/><path d="M0 575q160 -40 320 -10t320 0t320 -14t320 10" fill="none" stroke="${C.land2}" stroke-width="4"/>`;
}
const PEP = (t, o = {}) => pepita(t, 40, 368, 1.9, o);

/* ---------- scenes ---------- */
const scenes = {};

scenes[1] = t => {
  let s = '';
  const stops = [[440, 470, '🧭', 'Explorers'], [650, 400, '⛪', 'Missions'], [870, 360, '🐄', 'New settlers'], [1090, 290, '📜', 'Timeline']];
  s += `<path d="M320 540C380 500 400 480 440 470S560 420 650 400S780 380 870 360S1000 330 1090 290S1200 240 1240 230" fill="none" stroke="${C.trail}" stroke-width="14" stroke-dasharray="2 22" stroke-linecap="round"/>`;
  const lightA = E('b2') + .2;
  stops.forEach(([x, y, e, label], i) => {
    const on = pop(t, lightA + i * .45);
    s += `<circle cx="${x}" cy="${y}" r="30" fill="${on > 0 ? C.pop : '#fff'}" stroke="${C.ink}" stroke-width="3.5"/>${txt(x, y + 11, e, 30)}`;
    if (on > 0) s += pill(x, y - 58, label, 22, '#fff', C.ink, on);
  });
  s += txt(760, 150, 'Pepita’s Texas Trail', 76 * pop(t, S('a1') + .3), {w: 800, fill: C.accent});
  // Dilly scurries in, tries to curl, tips over, rights himself
  const dA = E('a1') + .1;
  if (t > dA){
    const x = lerp(1420, 1080, ease(prog(t, dA, dA + .8)));
    const cA = E('b1') + .1, tipA = cA + .9, upA = S('b2') - .1;
    const curl = t < upA ? .5 * ease(prog(t, cA, cA + .6)) : .5 * (1 - ease(prog(t, upA, upA + .4)));
    const rot = t < upA ? 175 * ease(prog(t, tipA, tipA + .5)) + (t > tipA + .5 ? Math.sin((t - tipA) * 9) * 6 * Math.exp(-(t - tipA)) : 0) : 175 * (1 - ease(prog(t, upA, upA + .4)));
    s += dilly(t, x, 590, .95, {curl, rot: rot, still: curl > .05});
    if (t > tipA + .4 && t < upA) s += txt(x - 40, 470, '😵', 40);
  }
  s += PEP(t, {wave: t > S('a1') && t < S('a1') + 1.4});
  return s;
};

scenes[2] = t => {
  let s = '';
  // ships (a3)
  const shOp = fade(t, S('a3'), W('a4', 'wealth') + .2, .4);
  if (shOp > 0){
    const p = prog(t, S('a3'), E('a3') + 1);
    s += `<g opacity="${shOp}"><path d="M300 420q60 -14 120 0t120 0t120 0t120 0t120 0t120 0t120 0t120 0" fill="none" stroke="${C.river}" stroke-width="6"/>
      ${ship(lerp(1450, 520, ease(p)), 380, .9, 'Spain', C.oops, Math.sin(t * 2) * 4)}${ship(lerp(1750, 800, ease(p)), 380, .9, 'Spain', C.oops, Math.sin(t * 2 + 1) * 4)}${ship(lerp(2050, 1080, ease(p)), 380, .9, 'France', C.accent, Math.sin(t * 2 + 2) * 4)}</g>`;
  }
  // three reasons (a4)
  const rOp = fade(t, W('a4', 'wealth') - .1, E('a4') + .7, .4);
  if (rOp > 0){
    [['💰', 'Wealth & trade', 'wealth'], ['🏁', 'Competition', 'competition'], ['🗺️', 'Expansion', 'expansion']].forEach(([e, label, w], i) => {
      s += card(470 + i * 290, 300, 250, 250, pop(t, W('a4', w)), `${txt(0, -10, e, 90)}${txt(0, 80, label, 30, {w: 800})}`, {op: rOp});
    });
  }
  // map + routes (a5..a8)
  const mOp = fade(t, S('a5') - .5, SC('3') + .1, .5);
  if (mOp > 0){
    s += texasMap(mOp);
    s += `<g opacity="${mOp}">`;
    const cv = [[-94.8,29.3],[-95.6,29.0],[-96.5,28.6],[-97.6,28.1],[-98.6,27.8],[-99.6,28.4],[-100.6,29.2],[-102.0,29.9],[-103.4,30.0],[-104.6,30.5],[-105.6,31.0]];
    const co = [[-103.1,35.4],[-102.2,35.0],[-101.4,34.6],[-100.6,34.8],[-100.2,35.3]];
    s += route(cv, prog(t, W('a5', 'traveled') - .3, W('a5', 'reported') + .5), C.oops);
    const wreck = pop(t, W('a5', 'shipwrecked'));
    if (wreck > 0){ const [x, y] = P(-94.8, 29.3); s += `<g transform="translate(${x + 26} ${y + 30}) scale(${wreck * .32}) rotate(-25)">${ship(0, 0, 1, '', C.oops)}</g>${txt(x + 40, y + 70, '1528', 22 * wreck, {w: 800, fill: C.oopsText})}`; }
    s += route(co, prog(t, W('a6', 'crossed'), W('a6', 'region')), '#C47A00');
    if (t > S('a7')){
      const [fx, fy] = P(-96.85, 28.75);
      const shP = ease(prog(t, S('a7') + .2, W('a7', 'fort')));
      s += `<g transform="translate(${lerp(fx + 150, fx + 40, shP)} ${lerp(fy + 90, fy + 40, shP)}) scale(.3)">${ship(0, 0, 1, '', C.accent)}</g>`;
      const fp = pop(t, W('a7', 'fort'));
      if (fp > 0) s += `<g transform="translate(${fx} ${fy}) scale(${fp})"><path d="M-18 0v-26h36v26z" fill="#A86B36" stroke="${C.ink}" stroke-width="3"/><path d="M-18 -26l4 -8 4 8 4 -8 4 8 4 -8 4 8 4 -8 4 8" fill="none" stroke="${C.ink}" stroke-width="3"/><path d="M0 -34v-30" stroke="${C.ink}" stroke-width="3"/><rect x="0" y="-64" width="26" height="17" fill="${C.accent}" stroke="${C.ink}" stroke-width="2.5"/></g>`;
    }
    // explorer card (upper left)
    const ex = [['a5', 'Cabeza de Vaca', 'Spain', '1528', C.oops], ['a6', 'Francisco Coronado', 'Spain', '1540s', '#C47A00'], ['a7', 'La Salle', 'France', '1685', C.accent]];
    ex.forEach(([id, name, ctry, yr, col], i) => {
      const end = i < 2 ? S(ex[i + 1][0]) - .1 : E('a8') + .6;
      if (t < S(id) - .1 || t >= end) return;
      const sc = pop(t, S(id) - .1);
      const bigFrance = id === 'a7' && t > S('a8');
      s += card(460, 210, 300, 190, sc, `<rect x="-150" y="-95" width="300" height="12" rx="6" fill="${col}"/>${txt(0, -30, name, name.length > 14 ? 30 : 36, {w: 800})}
        ${pill(-58, 26, ctry, bigFrance ? 30 : 24, ctry === 'France' ? C.soft : C.oopsSoft, ctry === 'France' ? C.accent : C.oopsText, bigFrance ? 1.15 : 1)}${pill(78, 26, yr, 24, C.popSoft, C.ink)}
        ${id === 'a7' ? txt(0, 75, 'built Fort St. Louis', 22, {fill: C.muted}) : id === 'a6' ? txt(0, 75, 'crossed the plains', 22, {fill: C.muted}) : txt(0, 75, 'shipwrecked, then reported', 22, {fill: C.muted})}`);
    });
    s += pill(460, 345, 'Spain + France = more competition!', 22, C.popSoft, C.ink, pop(t, W('a8', 'competition')));
    s += `</g>`;
  }
  // Dilly's mistake
  const dA = S('b3') - .8;
  if (t > dA && t < E('a8') + 1.2){
    const x = lerp(1420, 1190, ease(prog(t, dA, dA + .6)));
    s += dilly(t, x, 600, .85, {face: -1});
    s += bubble(1110, 470, 'Spanish?', 30, pop(t, S('b3')) * until(t, E('a8')), t > S('a8') ? pop(t, S('a8')) : 0);
  }
  s += PEP(t);
  return s;
};

scenes[3] = t => {
  let s = '';
  const colOp = fade(t, S('a9'), S('a12') + .1, .4);
  if (colOp > 0){
    s += `<g opacity="${colOp}">`;
    const col = (cx, title, bg, fg, sc) => sc > 0 ? `<g transform="translate(${cx} 330) scale(${sc}) translate(${-cx} -330)"><rect x="${cx - 175}" y="110" width="350" height="440" rx="24" fill="#fff" stroke="${C.ink}" stroke-width="4"/><rect x="${cx - 175}" y="110" width="350" height="64" rx="24" fill="${bg}" stroke="${C.ink}" stroke-width="4"/>${txt(cx, 154, title, 30, {w: 800, fill: fg})}</g>` : '';
    s += col(540, 'PRIMARY source', C.accent, '#fff', pop(t, W('a9', 'primary')));

scenes[6] = t => {

    if (i === 3) y -= Math.sin(p * Math.PI) * 140;

    s += check(x + 84, y - 100, pop(t, checks[i]));
  });
  if (t > S('b6') && t < fixA) s += txt(slotX(0), 155, '❌', 40 * pop(t, W('b6', 'austin')));
  s += `<path d="M330 450H1130" stroke="${C.ink}" stroke-width="5" marker-end="url(#ah)"/>${txt(330, 490, 'earliest', 22, {fill: C.muted, anchor: 'start'})}${txt(1130, 490, 'latest', 22, {fill: C.muted, anchor: 'end'})}`;

scenes[7] = t => {

      ${ql.map((ln, j) => txt(800, 195 + j * 48, ln, 38, {w: 700})).join('')}`;
    if (t >= E(q) && t < S(a)){
      const d = (S(a) - E(q)) / 3, rem = S(a) - t, n = Math.ceil(rem / d), frac = (rem % d) / d;

  const endP = pop(t, tipA + .9);
  if (endP > 0) s += banner(800, 520, 'The End!', 48, endP);
  s += PEP(t, {happy: t > S('a37') + .2, wave: t > tipA + .3});
  return s;
};

/* ---------- frame ---------- */
const DEFS = `<defs><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="${C.ink}"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="${C.oops}"/></marker></defs>`;
runVideo({
  scenes, background, bg: '#E8F5FF', defs: DEFS,
  overlay: t => t < .6 ? `<rect width="1280" height="720" fill="#E8F5FF" opacity="${1 - t / .6}"/>` : '',
});

window.SFX = () => {
  const c = [];
  c.push({t: E('a1') + .1, k: 'whoosh'});
  c.push({t: E('b1') + 1.0 + .5, k: 'knock'});
  for (let i = 0; i < 4; i++) c.push({t: E('b2') + .2 + i * .45, k: 'pop'});
  ['wealth', 'competition', 'expansion'].forEach(w => c.push({t: W('a4', w), k: 'pop'}));
  c.push({t: W('a5', 'shipwrecked'), k: 'splash'});
  c.push({t: W('a7', 'fort'), k: 'pop'});
  c.push({t: S('a8'), k: 'wrong'});
  c.push({t: S('a11'), k: 'wrong'});
  ['compass', 'legend', 'scale'].forEach(w => c.push({t: W('a12', w), k: 'pop'}));
  c.push({t: W('a15', 'mission'), k: 'pop'}); c.push({t: W('a15', 'san'), k: 'pop'}); c.push({t: W('a16', 'jose'), k: 'pop'});
  c.push({t: W('a20', '1821'), k: 'ding'});
  c.push({t: S('a21'), k: 'wrong'});
  c.push({t: W('a22', 'empresario'), k: 'whoosh'});
  c.push({t: W('b6', 'austin'), k: 'wrong'});
  c.push({t: W('a25', 'fix') + .2, k: 'whoosh'});
  [W('a25', 'european'), W('a25', 'spanish'), W('a25', 'mexico'), W('a25', 'empresarios')].forEach(x => c.push({t: x, k: 'pop'}));
  [['a28','a29'],['a30','a31'],['a32','a33'],['a34','a35']].forEach(([q, a]) => { const d = (S(a) - E(q)) / 3; for (let i = 0; i < 3; i++) c.push({t: E(q) + i * d, k: 'tick'}); c.push({t: S(a) - .05, k: 'ding'}); });
  c.push({t: E('a37') + .4 + .8 + .5, k: 'knock'});
  c.push({t: E('a37') + .4 + .8 + .9, k: 'tada'});
  return c;
};
seek(0);
</script>
