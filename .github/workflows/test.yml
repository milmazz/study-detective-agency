name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Reads mise.toml so CI runs the exact Node version this repo
      # pins locally — one place declares it, not two.
      - uses: jdx/mise-action@v2
      # Installs Vite (the build) and jsdom (test/dom.test.js). Without
      # jsdom those tests skip themselves rather than fail, so CI installs
      # deliberately to make sure the DOM half actually runs here.
      - run: npm ci
      - run: node --test
      # The tests run against the sources, not the build output, so a
      # config or page that breaks `vite build` breaks only the deploy.
      # Building here catches that before merge.
      - run: npm run build
